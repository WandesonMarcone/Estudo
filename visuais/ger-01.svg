<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">História de Uberlândia</title>
  <desc id="d">Ocupação do Triângulo Mineiro, São Sebastião do Uberabinha, emancipação no século XIX, mudança de nome no século XX e vocação logística.</desc>
  <defs>
    <linearGradient id="g01-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
  <path d="M24 160 h14 M24 148 v14 M696 160 h-14 M696 148 v14 M24 1206 h14 M24 1220 v-14 M696 1206 h-14 M696 1220 v-14" fill="none" stroke="#C4A35A" stroke-width="1.4"/>

  <rect width="720" height="132" fill="url(#g01-navy)"/>
  <line x1="36" y1="22" x2="128" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <line x1="592" y1="22" x2="684" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <circle cx="36" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="128" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" aria-hidden="true">
    <g transform="scale(0.0544) translate(-234 -275.3)">
      <polygon points="225,0 471,144 471,402 237,550 0,410 0,146" fill="#C4A35A"/>
      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">História de Uberlândia</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Do Uberabinha ao polo logístico</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Núcleo junto ao rio Uberabinha</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Pecuária e agricultura no Triângulo Mineiro</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="36" y="246" width="148" height="100" rx="6" fill="#0B1F38"/>
    <text x="110" y="278" text-anchor="middle" fill="#C4A35A" font-size="11" font-weight="700">1. OCUPAÇÃO</text>
    <text x="110" y="300" text-anchor="middle" fill="#F8F4EA" font-size="12">indígenas</text>
    <text x="110" y="318" text-anchor="middle" fill="#F8F4EA" font-size="12">agropecuária</text>
    <path d="M184 296 H204" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="204,290 216,296 204,302" fill="#C4A35A"/>
    <rect x="222" y="246" width="148" height="100" rx="6" fill="#0B1F38"/>
    <text x="296" y="278" text-anchor="middle" fill="#C4A35A" font-size="11" font-weight="700">2. NÚCLEO</text>
    <text x="296" y="300" text-anchor="middle" fill="#F8F4EA" font-size="12">S. Sebastião</text>
    <text x="296" y="318" text-anchor="middle" fill="#F8F4EA" font-size="12">do Uberabinha</text>
    <path d="M370 296 H390" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="390,290 402,296 390,302" fill="#C4A35A"/>
    <rect x="408" y="246" width="148" height="100" rx="6" fill="#0B1F38"/>
    <text x="482" y="278" text-anchor="middle" fill="#C4A35A" font-size="11" font-weight="700">3. SÉC. XIX</text>
    <text x="482" y="300" text-anchor="middle" fill="#F8F4EA" font-size="12">emancipação</text>
    <text x="482" y="318" text-anchor="middle" fill="#F8F4EA" font-size="12">fim do século</text>
    <path d="M556 296 H576" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="576,290 588,296 576,302" fill="#C4A35A"/>
    <rect x="594" y="246" width="90" height="100" rx="6" fill="#C4A35A"/>
    <text x="639" y="286" text-anchor="middle" fill="#0B1F38" font-size="11" font-weight="700">4. SÉC. XX</text>
    <text x="639" y="308" text-anchor="middle" fill="#0B1F38" font-size="12">Uberlândia</text>
  </g>

  <rect x="36" y="364" width="316" height="210" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="396" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Nome e rio</text>
  <line x1="56" y1="406" x2="176" y2="406" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="436" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Antigo nome: São Sebastião</text>
  <text x="56" y="460" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">do Uberabinha.</text>
  <text x="56" y="492" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Uberabinha = rio local,</text>
  <text x="56" y="516" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">não homenagem a pessoa.</text>
  <text x="56" y="548" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Mudança de nome no séc. XX.</text>

  <rect x="368" y="364" width="316" height="210" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="396" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Vocação logística</text>
  <line x1="388" y1="406" x2="528" y2="406" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="436" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Entroncamento rodoviário</text>
  <text x="388" y="460" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">do interior do Brasil.</text>
  <text x="388" y="492" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Polo de comércio, serviços</text>
  <text x="388" y="516" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">e distribuição regional.</text>
  <text x="388" y="548" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Posição explica a vocação.</text>

  <rect x="36" y="592" width="648" height="108" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="628" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Três termos da prova</text>
  <text x="56" y="656" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Triângulo Mineiro · Uberabinha · Polo regional</text>
  <text x="56" y="678" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Datas e nomes caem em sequência: distrito, emancipação e mudança de nome.</text>

  <rect x="36" y="718" width="648" height="168" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="718" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="746" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="746" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Linha do tempo cobrada</text>
  <text x="56" y="788" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Povoamento agropecuário no Triângulo Mineiro.</text>
  <text x="56" y="816" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Emancipação no fim do séc. XIX; Uberlândia no séc. XX.</text>
  <text x="56" y="856" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Não misturar criação do distrito, emancipação e novo nome.</text>

  <rect x="36" y="904" width="648" height="304" rx="8" fill="#0B1F38"/>
  <rect x="36" y="904" width="8" height="304" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 928)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="944" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="984" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Nome antigo deriva do rio Uberabinha.</text>
  <text x="64" y="1016" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Emancipação ≠ criação do distrito ≠ mudança de nome.</text>
  <text x="64" y="1048" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">A posição geográfica explica o polo logístico.</text>
  <line x1="64" y1="1068" x2="652" y2="1068" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1100" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Memorize a sequência: Uberabinha → emancipação → Uberlândia.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>


  <rect x="0" y="1260" width="720" height="60" fill="url(#g01-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
