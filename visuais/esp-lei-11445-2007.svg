      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Lei nº 11.445/2007</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Diretrizes nacionais do saneamento básico</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <g transform="translate(56 178)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <rect x="0" y="0" width="16" height="16" rx="2"/>
    <path d="M4 8 h8 M8 4 v8"/>
  </g>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Saneamento = quatro componentes</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Conjunto de quatro serviços essenciais</text>

  <rect x="36" y="246" width="648" height="280" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Os quatro serviços</text>
  <line x1="56" y1="286" x2="176" y2="286" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="56" y="304" width="292" height="88" rx="6" fill="#0B1F38"/>
  <text x="202" y="342" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">1. ÁGUA</text>
  <text x="202" y="364" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">abastecimento de água</text>
  <rect x="364" y="304" width="296" height="88" rx="6" fill="#0B1F38"/>
  <text x="512" y="342" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">2. ESGOTO</text>
  <text x="512" y="364" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">esgotamento sanitário</text>
  <rect x="56" y="408" width="292" height="88" rx="6" fill="#0B1F38"/>
  <text x="202" y="446" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">3. RESÍDUOS</text>
  <text x="202" y="468" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">limpeza urbana e manejo</text>
  <rect x="364" y="408" width="296" height="88" rx="6" fill="#C4A35A"/>
  <text x="512" y="446" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">4. DRENAGEM</text>
  <text x="512" y="468" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">águas pluviais</text>

  <rect x="36" y="544" width="648" height="148" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="576" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Titularidade</text>
  <line x1="56" y1="586" x2="176" y2="586" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="56" y="604" width="292" height="64" rx="6" fill="#0B1F38"/>
  <text x="202" y="644" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Município organiza</text>
  <g transform="translate(360 636)" fill="none" stroke="#C4A35A" stroke-width="2">
    <path d="M0 0 h22"/>
    <polygon points="22,-6 34,0 22,6" fill="#C4A35A" stroke="none"/>
  </g>
  <rect x="404" y="604" width="256" height="64" rx="6" fill="#C4A35A"/>
  <text x="532" y="644" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Prestação pode ser delegada</text>

  <rect x="36" y="710" width="316" height="186" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="710" width="316" height="36" rx="6" fill="#0B1F38"/>
  <rect x="36" y="734" width="316" height="12" fill="#0B1F38"/>
  <text x="56" y="734" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">O que a lei faz</text>
  <text x="56" y="774" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Estabelece as diretrizes</text>
  <text x="56" y="796" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">nacionais do saneamento.</text>
  <text x="56" y="832" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Saneamento básico:</text>
  <text x="56" y="854" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">conjunto dos quatro serviços.</text>
  <text x="56" y="876" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Titularidade: competência municipal.</text>

  <rect x="368" y="710" width="316" height="186" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="368" y="710" width="316" height="36" rx="6" fill="#0B1F38"/>
  <rect x="368" y="734" width="316" height="12" fill="#0B1F38"/>
  <text x="388" y="734" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Erro comum</text>
  <text x="388" y="774" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">São quatro componentes.</text>
  <text x="388" y="796" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Esquecer drenagem ou resíduos.</text>
  <text x="388" y="832" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Titularidade é municipal;</text>
  <text x="388" y="854" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">a prestação pode ser delegada.</text>
  <text x="388" y="876" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">A 14.026/2020 atualizou o marco.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Saneamento = água, esgoto, resíduos e drenagem.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Titularidade municipal, com possibilidade de delegação.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Esquecer drenagem ou resíduos é erro comum.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">A Lei 14.026/2020 atualizou o marco; não substituiu a 11.445.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h17-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
