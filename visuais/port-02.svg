  <text x="112" y="366" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">forma básica</text>
  <rect x="180" y="304" width="112" height="88" rx="6" fill="#0B1F38"/>
  <text x="236" y="344" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Descrição</text>
  <text x="236" y="366" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">forma básica</text>
  <rect x="304" y="304" width="128" height="88" rx="6" fill="#0B1F38"/>
  <text x="368" y="336" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Dissertação</text>
  <text x="368" y="356" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">/ exposição</text>
  <text x="368" y="376" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">forma básica</text>
  <rect x="444" y="304" width="112" height="88" rx="6" fill="#0B1F38"/>
  <text x="500" y="344" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Argumentação</text>
  <text x="500" y="366" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">forma básica</text>
  <rect x="568" y="304" width="92" height="88" rx="6" fill="#C4A35A"/>
  <text x="614" y="344" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Injunção</text>
  <text x="614" y="366" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">ordena / instrui</text>
  <text x="56" y="428" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Injunção: tipo que orienta/instrui ações (ordens, instruções).</text>
  <text x="56" y="452" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Uma bula ou receita tem predomínio injuntivo, mas pode descrever.</text>
  <text x="56" y="476" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Nem todo texto argumentativo é dissertação escolar.</text>
  <text x="56" y="504" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Tipologia não é o mesmo que gênero.</text>

  <rect x="36" y="544" width="648" height="156" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="576" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Gênero textual</text>
  <line x1="56" y1="586" x2="176" y2="586" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="56" y="604" width="100" height="48" rx="4" fill="#0B1F38"/>
  <text x="106" y="634" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">notícia</text>
  <rect x="168" y="604" width="100" height="48" rx="4" fill="#0B1F38"/>
  <text x="218" y="634" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">receita</text>
  <rect x="280" y="604" width="100" height="48" rx="4" fill="#0B1F38"/>
  <text x="330" y="634" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">ofício</text>
  <rect x="392" y="604" width="100" height="48" rx="4" fill="#0B1F38"/>
  <text x="442" y="634" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">e-mail</text>
  <rect x="504" y="604" width="156" height="48" rx="4" fill="#0B1F38"/>
  <text x="582" y="634" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">editorial</text>
  <text x="56" y="678" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Texto concreto ligado a uma situação de uso. Gêneros digitais e profissionais.</text>

  <rect x="36" y="718" width="648" height="178" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="36" y="718" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="746" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="746" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Serviço público</text>
  <text x="56" y="790" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Reconhecer gêneros comuns: ofício, memorando, requerimento.</text>
  <text x="56" y="822" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Tipo é base; gênero é realização.</text>
  <text x="56" y="862" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Confundir tipologia e gênero é erro recorrente.</text>

