<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Tipologia e gêneros</title>
  <desc id="d">Tipologia: narração, descrição, dissertação/exposição, argumentação e injunção. Gênero é realização concreta ligada ao uso.</desc>
