  <text x="56" y="716" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Físico ou digital, conforme o cadastro.</text>
  <text x="56" y="748" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Para conhecer e questionar o valor.</text>

