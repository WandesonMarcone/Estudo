  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Fatura: identificação, leituras, consumo, valor e vencimento.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Entrega no endereço ou meio informado pelo usuário.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">A conta não substitui a leitura do hidrômetro.</text>
