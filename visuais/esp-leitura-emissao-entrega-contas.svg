  <text x="388" y="692" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">A fatura é baseada na leitura.</text>
  <text x="388" y="716" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Não é a origem da medição.</text>
  <text x="388" y="748" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">A conta não substitui a leitura.</text>

