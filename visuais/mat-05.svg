  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" aria-hidden="true">
    <g transform="scale(0.0544) translate(-234 -275.3)">
      <polygon points="225,0 471,144 471,402 237,550 0,410 0,146" fill="#C4A35A"/>
      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Função quadrática</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">f(x) = ax² + bx + c</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">f(x) = ax² + bx + c, com a ≠ 0</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Gráfico: parábola. Δ = b² − 4ac</text>

  <rect x="36" y="246" width="316" height="268" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Concavidade</text>
  <line x1="56" y1="286" x2="176" y2="286" stroke="#C4A35A" stroke-width="1.4"/>
  <path d="M70 430 Q160 300 250 430" fill="none" stroke="#0B1F38" stroke-width="2.2"/>
  <text x="160" y="456" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">a &gt; 0  mínimo</text>
  <path d="M70 330 Q160 460 250 330" fill="none" stroke="#C4A35A" stroke-width="2.2"/>
  <circle cx="160" cy="300" r="4" fill="#0B1F38"/>
  <circle cx="160" cy="460" r="4" fill="#C4A35A"/>
  <text x="56" y="492" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">a &lt; 0: máximo. a &gt; 0: mínimo.</text>

  <rect x="368" y="246" width="316" height="268" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Discriminante</text>
  <line x1="388" y1="286" x2="508" y2="286" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="388" y="304" width="276" height="48" rx="6" fill="#0B1F38"/>
  <text x="526" y="334" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Δ &gt; 0  duas raízes</text>
  <rect x="388" y="360" width="276" height="48" rx="6" fill="#173B5F"/>
  <text x="526" y="390" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Δ = 0  uma raiz</text>
  <rect x="388" y="416" width="276" height="48" rx="6" fill="#C4A35A"/>
  <text x="526" y="446" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Δ &lt; 0  nenhuma real</text>
  <text x="388" y="492" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Δ negativo: ausência de raízes reais, não de gráfico.</text>

  <rect x="36" y="532" width="316" height="160" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="564" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Bhaskara</text>
  <text x="56" y="592" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Raízes pela fórmula de Bhaskara.</text>
  <text x="56" y="628" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Cuidado com o sinal de b.</text>
  <text x="56" y="660" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Δ indica o número de raízes.</text>

  <rect x="368" y="532" width="316" height="160" rx="8" fill="#0B1F38"/>
  <text x="388" y="564" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Vértice</text>
  <text x="388" y="592" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">x_v = −b/(2a)</text>
  <text x="388" y="616" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">y_v = −Δ/(4a)</text>
  <text x="388" y="648" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Ponto de máximo ou mínimo.</text>
  <text x="388" y="672" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Aplicações em máximos e mínimos.</text>

  <rect x="36" y="710" width="648" height="186" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="710" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="738" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="738" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Parábola</text>
  <text x="56" y="782" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Curva que representa a função quadrática.</text>
  <text x="56" y="810" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Concavidade conforme o sinal de a.</text>
  <text x="56" y="838" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Vértice é máximo (a &lt; 0) ou mínimo (a &gt; 0).</text>
  <text x="56" y="870" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Δ = b² − 4ac indica o número de raízes.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Δ &gt; 0: duas raízes; Δ = 0: uma; Δ &lt; 0: nenhuma real.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">x_v = −b/(2a) e y_v = −Δ/(4a).</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Vértice é máximo (a &lt; 0) ou mínimo (a &gt; 0).</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Δ negativo: ausência de raízes reais, não de gráfico.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#m05-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
