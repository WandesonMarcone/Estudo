<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Funcionamento e leitura do hidrômetro</title>
  <desc id="d">Fluxo da água até o mostrador: algarismos pretos em m³ inteiros e vermelhos em frações. Consumo é a diferença entre leituras.</desc>
  <defs>
    <linearGradient id="h2-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
    <linearGradient id="h2-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9D3C6"/>
      <stop offset="0.5" stop-color="#A8A193"/>
      <stop offset="1" stop-color="#6F6A5E"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
