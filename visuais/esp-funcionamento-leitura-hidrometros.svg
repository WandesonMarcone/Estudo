    <rect x="128" y="10" width="78" height="28" rx="2" fill="url(#h2-metal)"/>
    <rect x="-188" y="-118" width="376" height="118" rx="10" fill="#0B1F38"/>
    <rect x="-170" y="-100" width="58" height="78" rx="6" fill="#14110C"/>
    <text x="-141" y="-46" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="36" font-weight="700">0</text>
    <rect x="-104" y="-100" width="58" height="78" rx="6" fill="#14110C"/>
    <text x="-75" y="-46" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="36" font-weight="700">1</text>
    <rect x="-38" y="-100" width="58" height="78" rx="6" fill="#14110C"/>
    <text x="-9" y="-46" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="36" font-weight="700">2</text>
    <rect x="28" y="-100" width="58" height="78" rx="6" fill="#14110C"/>
    <text x="57" y="-46" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="36" font-weight="700">4</text>
    <rect x="94" y="-100" width="58" height="78" rx="6" fill="#6B1C1C"/>
    <text x="123" y="-46" text-anchor="middle" fill="#E8B4B4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="36" font-weight="700">3</text>
    <rect x="160" y="-100" width="58" height="78" rx="6" fill="#6B1C1C"/>
    <text x="189" y="-46" text-anchor="middle" fill="#E8B4B4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="36" font-weight="700">5</text>
  </g>
  <text x="620" y="430" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700">m³</text>

  <g fill="none" stroke="#C4A35A" stroke-width="1.35">
    <circle cx="250" cy="374" r="4"/>
    <path d="M250 374 H120 V330"/>
    <circle cx="120" cy="330" r="3"/>
    <circle cx="530" cy="374" r="4"/>
    <path d="M530 374 H640 V330"/>
    <circle cx="640" cy="330" r="3"/>
  </g>
  <text x="56" y="322" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">PRETO</text>
  <text x="56" y="338" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">m³ inteiros</text>
  <text x="568" y="322" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">VERMELHO</text>
  <text x="568" y="338" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">fração (litros)</text>

  <rect x="56" y="548" width="292" height="58" rx="6" fill="#0B1F38"/>
  <text x="202" y="572" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">PRETO = m³ inteiros</text>
  <text x="202" y="592" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">usado no faturamento</text>
  <rect x="368" y="548" width="292" height="58" rx="6" fill="#6B1C1C"/>
  <text x="514" y="572" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">VERMELHO = fração (litros)</text>
  <text x="514" y="592" text-anchor="middle" fill="#E8B4B4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">desprezado na conta</text>

  <text x="360" y="638" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="700">Leitura de faturamento: 124 m³</text>
  <text x="360" y="662" text-anchor="middle" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">A parte vermelha (0,35 m³) não entra na conta.</text>

  <rect x="36" y="692" width="648" height="196" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="692" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="720" width="648" height="12" fill="#0B1F38"/>
  <g transform="translate(56 706)" fill="none" stroke="#C4A35A" stroke-width="1.4">
    <path d="M0 7 h16"/>
    <polygon points="16,4 22,7 16,10" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="88" y="720" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Consumo do período</text>
  <text x="360" y="768" text-anchor="middle" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" font-weight="700">consumo = leitura atual − leitura anterior</text>
  <text x="360" y="802" text-anchor="middle" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Se a atual for menor: pode ser troca ou virada do mostrador, não fraude.</text>
  <text x="360" y="828" text-anchor="middle" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Desgaste e instalação inadequada tendem a gerar subregistro.</text>
  <text x="360" y="856" text-anchor="middle" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">O hidrômetro acumula volume. Não mede pressão nem vazão instantânea.</text>
  <text x="360" y="872" text-anchor="middle" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">1 m³ = 1.000 litros.</text>

  <rect x="36" y="908" width="648" height="300" rx="8" fill="#0B1F38"/>
  <rect x="36" y="908" width="8" height="300" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 932)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="948" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="988" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Preto = m³ inteiros (faturamento).</text>
  <text x="64" y="1020" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Vermelho = litros / fração de m³ (não fatura).</text>
  <text x="64" y="1052" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">1 m³ = 1.000 litros.</text>
  <line x1="64" y1="1072" x2="652" y2="1072" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1104" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Subregistro: o medidor registra menos do que passou.</text>
  <text x="64" y="1178" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h2-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
