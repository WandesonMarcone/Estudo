    </g>
    <text x="270" y="186" fill="#F8F4EA" font-size="13" font-weight="700">2. MEDIÇÃO</text>
    <text x="270" y="206" fill="#C4A35A" font-size="11">peça interna gira</text>
    <path d="M378 192 H402" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="402,186 414,192 402,198" fill="#C4A35A"/>

    <rect x="420" y="156" width="150" height="72" rx="6" fill="#0B1F38"/>
    <g transform="translate(436 180)" fill="none" stroke="#C4A35A" stroke-width="1.4">
      <rect x="0" y="2" width="16" height="12" rx="1"/>
      <path d="M3 6 h10 M3 10 h6"/>
    </g>
    <text x="462" y="186" fill="#F8F4EA" font-size="13" font-weight="700">3. CONTAGEM</text>
    <text x="462" y="206" fill="#C4A35A" font-size="11">volume em m³</text>
    <path d="M570 192 H594" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="594,186 606,192 594,198" fill="#C4A35A"/>

    <rect x="612" y="156" width="72" height="72" rx="6" fill="#C4A35A"/>
    <text x="648" y="186" text-anchor="middle" fill="#0B1F38" font-size="14" font-weight="700">4.</text>
    <text x="648" y="206" text-anchor="middle" fill="#0B1F38" font-size="12" font-weight="700">leitura</text>
  </g>

  <rect x="36" y="246" width="648" height="430" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Mostrador didático (exemplo)</text>
  <line x1="56" y1="286" x2="176" y2="286" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="308" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Não é um modelo comercial. Serve só para reconhecer pretos e vermelhos.</text>

  <g transform="translate(360 470)">
    <rect x="-210" y="10" width="78" height="28" rx="2" fill="url(#h2-metal)"/>
    <rect x="-140" y="0" width="12" height="48" fill="#8A8374"/>
    <rect x="-128" y="-8" width="256" height="64" rx="32" fill="url(#h2-metal)" stroke="#0B1F38" stroke-width="2"/>
