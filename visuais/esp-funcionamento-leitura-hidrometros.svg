  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Funcionamento e leitura</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Hidrômetro mede volume, não pressão</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="36" y="156" width="150" height="72" rx="6" fill="#0B1F38"/>
    <g transform="translate(52 178)" fill="none" stroke="#C4A35A" stroke-width="1.4">
