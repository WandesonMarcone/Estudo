      <path d="M8 5 v6 M5 8 h6"/>
    </g>
    <text x="78" y="186" fill="#F8F4EA" font-size="13" font-weight="700">1. ÁGUA</text>
    <text x="78" y="206" fill="#C4A35A" font-size="11">entra no medidor</text>
    <path d="M186 192 H210" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="210,186 222,192 210,198" fill="#C4A35A"/>

    <rect x="228" y="156" width="150" height="72" rx="6" fill="#0B1F38"/>
