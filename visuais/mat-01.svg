      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Conjuntos</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">União, interseção e diferença</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Conjunto é uma coleção de elementos</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Diagrama de Venn representa as relações visualmente</text>

  <rect x="36" y="246" width="648" height="268" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">União, interseção e diferença</text>
  <line x1="56" y1="286" x2="176" y2="286" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="86" y="300" width="548" height="168" rx="6" fill="#F7F3E8" stroke="#8A8374" stroke-width="1.4"/>
  <text x="104" y="322" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">U</text>
  <circle cx="300" cy="392" r="78" fill="#C4A35A" fill-opacity="0.28" stroke="#0B1F38" stroke-width="2.2"/>
  <circle cx="420" cy="392" r="78" fill="#0B1F38" fill-opacity="0.18" stroke="#0B1F38" stroke-width="2.2"/>
  <text x="248" y="362" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">A</text>
  <text x="456" y="362" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">B</text>
  <text x="248" y="404" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">só A</text>
  <text x="344" y="404" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">A ∩ B</text>
  <text x="456" y="404" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">só B</text>
  <text x="360" y="492" text-anchor="middle" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</text>

  <rect x="36" y="532" width="200" height="160" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="564" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">União</text>
  <text x="52" y="592" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Elementos de A ou B.</text>
  <text x="52" y="620" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Pertencem a A ou a B.</text>
  <text x="52" y="656" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Cardinalidade: n</text>
  <text x="52" y="676" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">número de elementos.</text>

  <rect x="252" y="532" width="200" height="160" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="272" y="564" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Interseção</text>
  <text x="268" y="592" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Elementos comuns.</text>
  <text x="268" y="620" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Comuns a A e B.</text>
  <text x="268" y="656" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Descontar n(A ∩ B)</text>
  <text x="268" y="676" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">ao somar n(A)+n(B).</text>

  <rect x="468" y="532" width="216" height="160" rx="8" fill="#0B1F38"/>
  <text x="488" y="564" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Diferença</text>
  <text x="484" y="592" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">De A que não estão em B.</text>
  <text x="484" y="620" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Complementar depende</text>
  <text x="484" y="640" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">do universo adotado.</text>
  <text x="484" y="672" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Vazio e universo.</text>

  <rect x="36" y="710" width="648" height="186" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="710" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="738" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="738" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Pertinência e inclusão</text>
  <text x="56" y="782" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Pertinência (∈): relaciona elemento e conjunto.</text>
  <text x="56" y="810" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Inclusão (⊂): relaciona conjunto e conjunto.</text>
  <text x="56" y="838" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Uso de Venn em problemas de contagem.</text>
  <text x="56" y="870" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Não somar n(A) + n(B) sem descontar a interseção.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">n(A ∪ B) = n(A) + n(B) − n(A ∩ B).</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Não somar n(A) + n(B) sem descontar a interseção.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Pertinência: elemento e conjunto. Inclusão: conjunto e conjunto.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Complementar depende do conjunto universo adotado.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#m01-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
