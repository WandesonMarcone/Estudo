<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Interpretação de textos</title>
  <desc id="d">Interpretar é compreender o que o texto diz e o que se pode concluir a partir dele, com base em evidências do próprio texto.</desc>
  <defs>
    <linearGradient id="p01-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>

  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
  <path d="M24 160 h14 M24 148 v14 M696 160 h-14 M696 148 v14 M24 1206 h14 M24 1220 v-14 M696 1206 h-14 M696 1220 v-14" fill="none" stroke="#C4A35A" stroke-width="1.4"/>

  <rect width="720" height="132" fill="url(#p01-navy)"/>
  <line x1="36" y1="22" x2="128" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <line x1="592" y1="22" x2="684" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <circle cx="36" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="128" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" aria-hidden="true">
    <g transform="scale(0.0544) translate(-234 -275.3)">
      <polygon points="225,0 471,144 471,402 237,550 0,410 0,146" fill="#C4A35A"/>
      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Interpretação de textos</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Explícito, implícito e extrapolação</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Compreender o que o texto diz e o que se pode concluir</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Com base em evidências do próprio texto</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="36" y="246" width="188" height="88" rx="6" fill="#0B1F38"/>
    <text x="130" y="280" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">1. EXPLÍCITO</text>
    <text x="130" y="304" text-anchor="middle" fill="#F8F4EA" font-size="13">localizar</text>
    <path d="M224 290 H248" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="248,284 260,290 248,296" fill="#C4A35A"/>
    <rect x="266" y="246" width="188" height="88" rx="6" fill="#0B1F38"/>
    <text x="360" y="280" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">2. IMPLÍCITO</text>
    <text x="360" y="304" text-anchor="middle" fill="#F8F4EA" font-size="13">inferir com apoio</text>
    <path d="M454 290 H478" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="478,284 490,290 478,296" fill="#C4A35A"/>
    <rect x="496" y="246" width="188" height="88" rx="6" fill="#C4A35A"/>
    <text x="590" y="280" text-anchor="middle" fill="#0B1F38" font-size="12" font-weight="700">3. CENTRAL</text>
    <text x="590" y="304" text-anchor="middle" fill="#0B1F38" font-size="13">ideia e finalidade</text>
  </g>

  <rect x="36" y="352" width="316" height="220" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="384" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Inferência</text>
  <line x1="56" y1="394" x2="176" y2="394" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="428" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Conclusão com apoio no texto.</text>
  <text x="56" y="452" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Identificar tese, argumento,</text>
  <text x="56" y="476" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">finalidade e intenção.</text>
  <text x="56" y="516" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Paráfrase: reescrita que</text>
  <text x="56" y="540" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">mantém o sentido original.</text>

  <rect x="368" y="352" width="316" height="220" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="384" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Extrapolação</text>
  <line x1="388" y1="394" x2="508" y2="394" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="428" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Conclusão além do texto.</text>
  <text x="388" y="452" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Reduzir: só repetir o literal.</text>
  <text x="388" y="476" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Não confundir opinião do autor</text>
  <text x="388" y="500" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">com a do leitor.</text>
  <text x="388" y="540" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Distorção altera o sentido.</text>

  <rect x="36" y="590" width="648" height="108" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="628" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Coerência com o contexto e com o gênero</text>
  <text x="56" y="656" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Ideia central, ideias secundárias e finalidade do texto.</text>
  <text x="56" y="678" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção a paráfrases fiéis e a distorções sutis.</text>

  <rect x="36" y="716" width="648" height="180" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="716" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="744" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="744" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Armadilha das alternativas</text>
  <text x="56" y="788" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Trocam uma palavra que muda o sentido.</text>
  <text x="56" y="816" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">sempre, nunca, todos.</text>
  <text x="56" y="856" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Reconhecer o que está apoiado no texto e o que é extrapolação.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Localizar o explícito e inferir o implícito com apoio.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Paráfrase mantém o sentido; distorção altera.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Não confundir opinião do autor com a do leitor.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">sempre, nunca, todos: uma palavra muda o sentido.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#p01-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
