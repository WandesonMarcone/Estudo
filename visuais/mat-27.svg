<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Orientação espacial e temporal</title>
  <desc id="d">Pontos cardeais, giros, simetria. Datas, horários e intervalos. Sentido do giro e ano bissexto.</desc>
  <defs>
    <linearGradient id="m27-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
