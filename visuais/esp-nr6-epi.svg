  </g>
  <text x="82" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Empregador</text>
  <text x="56" y="318" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Fornece o EPI gratuitamente.</text>
  <text x="56" y="346" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Adequado ao risco.</text>
  <text x="56" y="374" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Treina o trabalhador.</text>
  <text x="56" y="414" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Fornecer não transfere</text>
  <text x="56" y="436" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">o dever de adquirir.</text>
  <text x="56" y="458" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">O trabalhador não compra o EPI.</text>

  <rect x="368" y="246" width="316" height="232" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="368" y="246" width="316" height="40" rx="8" fill="#0B1F38"/>
  <rect x="368" y="274" width="316" height="12" fill="#0B1F38"/>
  <g transform="translate(386 258)" fill="none" stroke="#C4A35A" stroke-width="1.4">
    <circle cx="8" cy="8" r="7"/>
    <path d="M5 8 L7.5 10.5 L12 5"/>
  </g>
  <text x="414" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Trabalhador</text>
  <text x="388" y="318" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Usa o EPI.</text>
  <text x="388" y="346" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Conserva o EPI.</text>
  <text x="388" y="374" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Uso obrigatório.</text>
  <text x="388" y="414" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Última barreira</text>
  <text x="388" y="436" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">contra o risco.</text>
  <text x="388" y="458" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Não substitui a proteção coletiva.</text>

  <rect x="36" y="496" width="648" height="220" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="528" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Prioridade da proteção</text>
  <line x1="56" y1="538" x2="176" y2="538" stroke="#C4A35A" stroke-width="1.4"/>
  <polygon points="360,556 500,620 220,620" fill="#0B1F38"/>
  <text x="360" y="608" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">COLETIVA</text>
  <rect x="220" y="628" width="280" height="48" rx="4" fill="#C4A35A"/>
  <text x="360" y="658" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">EPI — última barreira</text>
  <g fill="none" stroke="#C4A35A" stroke-width="1.35">
    <circle cx="500" cy="588" r="4"/>
    <path d="M500 588 H576 V556"/>
    <circle cx="576" cy="556" r="3"/>
  </g>
  <text x="516" y="548" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Prioridade</text>
  <text x="516" y="564" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">protege todos</text>
  <text x="56" y="698" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Proteção coletiva: medida que protege todos no ambiente.</text>

  <rect x="36" y="734" width="316" height="162" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="734" width="316" height="36" rx="6" fill="#0B1F38"/>
  <rect x="36" y="758" width="316" height="12" fill="#0B1F38"/>
  <text x="56" y="758" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">CA — Certificado de Aprovação</text>
  <text x="56" y="800" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Atesta requisitos técnicos.</text>
  <text x="56" y="824" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Deve estar válido.</text>
  <text x="56" y="860" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Sem CA válido: não comercializar</text>
  <text x="56" y="880" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">nem usar o EPI.</text>

  <rect x="368" y="734" width="316" height="162" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="368" y="734" width="316" height="36" rx="6" fill="#0B1F38"/>
  <rect x="368" y="758" width="316" height="12" fill="#0B1F38"/>
  <text x="388" y="758" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">O que o EPI é</text>
  <text x="388" y="800" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Equipamento de Proteção</text>
  <text x="388" y="824" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Individual.</text>
  <text x="388" y="860" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Uso obrigatório.</text>
  <text x="388" y="880" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Adequado ao risco da atividade.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Empregador fornece EPI gratuito e treina.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Trabalhador usa e conserva. CA válido é exigido.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Proteção coletiva tem prioridade sobre o EPI.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Sem CA válido, o EPI não pode ser comercializado nem usado.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

