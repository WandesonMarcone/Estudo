    <path d="M8 5 v6"/>
  </g>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">EPI adequado ao risco, de uso obrigatório</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Não substitui a proteção coletiva</text>

  <rect x="36" y="246" width="316" height="232" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="246" width="316" height="40" rx="8" fill="#0B1F38"/>
