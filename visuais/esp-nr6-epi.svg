<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">NR-6 e Equipamento de Proteção Individual</title>
  <desc id="d">Empregador fornece EPI gratuito e treina. Trabalhador usa e conserva. CA válido. Proteção coletiva tem prioridade.</desc>
