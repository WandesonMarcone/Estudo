<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Meio ambiente</title>
  <desc id="d">Desenvolvimento sustentável nas três dimensões; PNMA 1981, Código Florestal 2012 e Lei de Crimes Ambientais 1998; licenciamento, UC e APP.</desc>
