  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Meio ambiente</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Sustentabilidade, leis e APP</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Desenvolvimento sustentável: três dimensões</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Equidade entre gerações — não reduzir a uma dimensão</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="36" y="246" width="208" height="100" rx="6" fill="#0B1F38"/>
    <text x="140" y="286" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">ECONÔMICA</text>
    <text x="140" y="312" text-anchor="middle" fill="#F8F4EA" font-size="13">crescimento</text>
    <rect x="256" y="246" width="208" height="100" rx="6" fill="#0B1F38"/>
    <text x="360" y="286" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">SOCIAL</text>
    <text x="360" y="312" text-anchor="middle" fill="#F8F4EA" font-size="13">inclusão</text>
    <rect x="476" y="246" width="208" height="100" rx="6" fill="#C4A35A"/>
    <text x="580" y="286" text-anchor="middle" fill="#0B1F38" font-size="12" font-weight="700">AMBIENTAL</text>
    <text x="580" y="312" text-anchor="middle" fill="#0B1F38" font-size="13">preservação</text>
  </g>

  <rect x="36" y="364" width="648" height="130" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="396" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Marcos legais — não confundir as leis</text>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">
    <rect x="56" y="412" width="196" height="60" rx="6" fill="#0B1F38"/>
    <text x="154" y="438" text-anchor="middle" fill="#C4A35A" font-weight="700">PNMA</text>
    <text x="154" y="458" text-anchor="middle" fill="#F8F4EA">Lei 6.938/1981</text>
    <rect x="262" y="412" width="196" height="60" rx="6" fill="#0B1F38"/>
    <text x="360" y="438" text-anchor="middle" fill="#C4A35A" font-weight="700">Cód. Florestal</text>
    <text x="360" y="458" text-anchor="middle" fill="#F8F4EA">Lei 12.651/2012</text>
    <rect x="468" y="412" width="196" height="60" rx="6" fill="#C4A35A"/>
    <text x="566" y="438" text-anchor="middle" fill="#0B1F38" font-weight="700">Crimes amb.</text>
    <text x="566" y="458" text-anchor="middle" fill="#0B1F38">Lei 9.605/1998</text>
  </g>

  <rect x="36" y="512" width="316" height="218" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="544" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Licenciamento</text>
  <line x1="56" y1="554" x2="200" y2="554" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="588" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Controle prévio de</text>
  <text x="56" y="612" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">atividades impactantes.</text>
  <text x="56" y="644" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Unidades de conservação</text>
  <text x="56" y="668" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">protegem áreas definidas.</text>
  <text x="56" y="700" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Procedimento estatal prévio.</text>

  <rect x="368" y="512" width="316" height="218" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="544" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">APP</text>
  <line x1="388" y1="554" x2="460" y2="554" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="588" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Área de Preservação</text>
  <text x="388" y="612" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Permanente.</text>
  <text x="388" y="644" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Margens, nascentes</text>
  <text x="388" y="668" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">e encostas.</text>
  <text x="388" y="700" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Protegida mesmo fora de UC.</text>

  <rect x="36" y="748" width="648" height="134" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="748" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="776" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="776" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Equidade intergeracional</text>
  <text x="56" y="820" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Atender necessidades atuais sem comprometer as futuras.</text>
  <text x="56" y="852" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">PNMA (1981) ≠ Código Florestal (2012).</text>
  <rect x="36" y="900" width="648" height="308" rx="8" fill="#0B1F38"/>
  <rect x="36" y="900" width="8" height="308" rx="4" fill="#C4A35A"/>
