    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="940" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="980" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Sustentabilidade tem três dimensões; reduzir a uma é incorreto.</text>
  <text x="64" y="1012" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Não confundir PNMA (1981) com o Código Florestal (2012).</text>
  <text x="64" y="1044" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">APP é protegida por lei, mesmo fora de unidade de conservação.</text>
  <line x1="64" y1="1076" x2="652" y2="1076" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1108" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Leis 6.938/1981, 12.651/2012 e 9.605/1998.</text>
  <text x="64" y="1180" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>


  <rect x="0" y="1260" width="720" height="60" fill="url(#g16-navy)"/>
