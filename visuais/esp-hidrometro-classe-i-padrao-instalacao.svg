<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Hidrômetro Classe I e padrão de instalação</title>
  <desc id="d">Esquema didático: rede, trecho reto, registro a montante, hidrômetro com lacre e visor, trecho reto e ramal do usuário.</desc>
  <defs>
    <linearGradient id="h1-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
    <linearGradient id="h1-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9D3C6"/>
      <stop offset="0.5" stop-color="#A8A193"/>
      <stop offset="1" stop-color="#6F6A5E"/>
    </linearGradient>
    <linearGradient id="h1-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C56A"/>
      <stop offset="1" stop-color="#9A7420"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
