  </g>
  <text x="98" y="186" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Classe I</text>
  <text x="98" y="208" fill="#D8C48A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Exatidão na faixa de vazão</text>
  <text x="70" y="224" fill="#B9B3A4" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Requisito metrológico</text>

  <rect x="372" y="156" width="300" height="78" rx="6" fill="#EDE7D8" stroke="#C4A35A" stroke-width="1.2"/>
  <text x="392" y="186" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Não é diâmetro do medidor</text>
  <text x="392" y="208" fill="#5C574C" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Nem categoria tarifária</text>
  <text x="392" y="224" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Classe metrológica &#8800; classe de consumo</text>

  <rect x="48" y="250" width="624" height="430" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="68" y="278" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Esquema do ramal</text>
  <line x1="68" y1="288" x2="188" y2="288" stroke="#C4A35A" stroke-width="1.4"/>

  <rect x="60" y="304" width="78" height="52" rx="4" fill="#0B1F38"/>
  <text x="99" y="326" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">REDE</text>
  <text x="99" y="344" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">entrada</text>
  <rect x="138" y="324" width="40" height="10" fill="#8A8374"/>
  <text x="158" y="318" text-anchor="middle" fill="#7A7466" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700">trecho reto</text>
  <rect x="178" y="300" width="86" height="60" rx="4" fill="#0B1F38"/>
  <text x="221" y="326" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700">REGISTRO</text>
  <text x="221" y="344" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">montante</text>
  <rect x="264" y="324" width="28" height="10" fill="#8A8374"/>
  <rect x="292" y="296" width="136" height="68" rx="8" fill="#0B1F38"/>
  <circle cx="348" cy="326" r="18" fill="#F7F3E8" stroke="#C4A35A" stroke-width="2"/>
  <text x="348" y="322" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="8" font-weight="700">VISOR</text>
  <text x="348" y="334" text-anchor="middle" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="9" font-weight="700">m³</text>
  <rect x="400" y="308" width="12" height="22" rx="2" fill="url(#h1-gold)"/>
  <text x="360" y="356" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700">HIDRÔMETRO</text>
  <rect x="428" y="324" width="40" height="10" fill="#8A8374"/>
  <text x="448" y="318" text-anchor="middle" fill="#7A7466" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700">trecho reto</text>
  <rect x="468" y="304" width="86" height="52" rx="4" fill="#0B1F38"/>
  <text x="511" y="326" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700">USUÁRIO</text>
  <text x="511" y="344" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">saída</text>
  <polygon points="600,330 616,322 616,338" fill="#C4A35A"/>
  <text x="640" y="334" text-anchor="middle" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">fluxo</text>

  <g transform="translate(360 500)">
    <rect x="-168" y="-12" width="64" height="24" rx="2" fill="url(#h1-metal)"/>
    <rect x="-104" y="-20" width="12" height="40" fill="#8A8374"/>
    <rect x="-92" y="-28" width="184" height="56" rx="28" fill="url(#h1-metal)" stroke="#0B1F38" stroke-width="2"/>
    <rect x="80" y="-20" width="12" height="40" fill="#8A8374"/>
    <rect x="92" y="-12" width="64" height="24" rx="2" fill="url(#h1-metal)"/>
    <ellipse cx="0" cy="-86" rx="58" ry="58" fill="#0B1F38"/>
    <circle cx="0" cy="-86" r="46" fill="#F7F3E8" stroke="#C4A35A" stroke-width="2"/>
    <g stroke="#9A9384" stroke-width="1.2">
      <line x1="0" y1="-124" x2="0" y2="-116"/>
      <line x1="38" y1="-86" x2="30" y2="-86"/>
      <line x1="-38" y1="-86" x2="-30" y2="-86"/>
      <line x1="0" y1="-48" x2="0" y2="-56"/>
