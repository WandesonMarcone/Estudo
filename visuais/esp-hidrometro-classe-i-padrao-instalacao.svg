  <text x="510" y="384" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Visor acessível</text>
  <text x="510" y="400" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">espaço livre para leitura</text>
  <text x="552" y="534" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Lacre (amarelo)</text>
  <text x="552" y="550" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">comprova que o medidor</text>
  <text x="552" y="564" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">não foi violado</text>
  <text x="48" y="534" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Horizontal</text>
  <text x="48" y="550" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">seta no sentido</text>
  <text x="48" y="564" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">do fluxo</text>

  <text x="360" y="600" text-anchor="middle" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Instalar na horizontal, com a seta no sentido do fluxo.</text>
  <text x="360" y="622" text-anchor="middle" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Visor acessível: espaço livre para leitura.</text>
  <text x="360" y="648" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Medidor fornecido e instalado pelo prestador.</text>
  <text x="360" y="668" text-anchor="middle" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Registro a montante (antes do hidrômetro) permite isolar o ramal.</text>

  <rect x="48" y="696" width="200" height="196" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="48" y="696" width="200" height="36" rx="6" fill="#0B1F38"/>
  <rect x="48" y="720" width="200" height="12" fill="#0B1F38"/>
  <g transform="translate(64 708)" fill="none" stroke="#C4A35A" stroke-width="1.4">
    <rect width="14" height="14" rx="2"/>
    <path d="M4 7 h6"/>
  </g>
  <text x="88" y="720" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Classe I</text>
  <text x="64" y="760" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Exatidão do</text>
  <text x="64" y="780" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">equipamento na</text>
  <text x="64" y="800" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">faixa de vazão.</text>
  <text x="64" y="836" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Requisito</text>
  <text x="64" y="856" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">metrológico.</text>

  <rect x="260" y="696" width="200" height="196" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="260" y="696" width="200" height="36" rx="6" fill="#0B1F38"/>
  <rect x="260" y="720" width="200" height="12" fill="#0B1F38"/>
  <g transform="translate(276 708)" fill="none" stroke="#C4A35A" stroke-width="1.4">
    <path d="M0 7 h14"/>
    <path d="M2 4 v6 M7 4 v6 M12 4 v6"/>
  </g>
  <text x="300" y="720" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Trecho reto</text>
  <text x="276" y="760" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Tubo sem curvas</text>
  <text x="276" y="780" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">antes e depois.</text>
  <text x="276" y="800" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Estabiliza o fluxo.</text>
  <text x="276" y="836" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Evita erro e</text>
  <text x="276" y="856" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">subregistro.</text>

  <rect x="472" y="696" width="200" height="196" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="472" y="696" width="200" height="36" rx="6" fill="#0B1F38"/>
  <rect x="472" y="720" width="200" height="12" fill="#0B1F38"/>
  <g transform="translate(488 706)">
    <rect x="3" y="6" width="10" height="12" rx="1" fill="#C4A35A"/>
    <rect x="5" y="1" width="6" height="7" rx="2" fill="none" stroke="#C4A35A" stroke-width="1.4"/>
  </g>
  <text x="512" y="720" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Lacre</text>
  <text x="488" y="760" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Inviolabilidade</text>
  <text x="488" y="780" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">do medidor.</text>
  <text x="488" y="800" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Uso obrigatório.</text>
  <text x="488" y="836" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Lacre rompido</text>
  <text x="488" y="856" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">= irregularidade.</text>

  <rect x="48" y="912" width="624" height="296" rx="8" fill="#0B1F38"/>
  <rect x="48" y="912" width="8" height="296" rx="4" fill="#C4A35A"/>
  <g transform="translate(76 936)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="102" y="952" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="76" y="992" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Classe do hidrômetro &#8800; diâmetro nominal.</text>
  <text x="76" y="1024" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Classe metrológica &#8800; classe de consumo tarifário.</text>
  <text x="76" y="1056" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Fora do padrão: fluxo instável, erro e subregistro.</text>
  <line x1="76" y1="1076" x2="644" y2="1076" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="76" y="1108" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Posição, trechos retos, visor livre e lacre: o essencial do padrão.</text>
  <text x="76" y="1140" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Esquema simplificado para estudo — não substitui o padrão oficial do DMAE.</text>
  <text x="76" y="1180" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h1-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
