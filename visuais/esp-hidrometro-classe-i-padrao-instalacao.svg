    <text x="0" y="-68" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11" font-weight="700">VISOR</text>
    <text x="0" y="-54" text-anchor="middle" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">m³</text>
    <rect x="62" y="-6" width="14" height="24" rx="2" fill="url(#h1-gold)"/>
    <rect x="65" y="-16" width="8" height="10" rx="2" fill="none" stroke="#9A7420" stroke-width="1.4"/>
    <text x="0" y="46" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">HIDRÔMETRO</text>
  </g>

  <g fill="none" stroke="#C4A35A" stroke-width="1.35">
    <circle cx="360" cy="414" r="4"/>
    <path d="M360 414 H500 V392"/>
    <circle cx="500" cy="392" r="3"/>
    <circle cx="436" cy="494" r="4"/>
