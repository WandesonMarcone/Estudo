  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Hidrômetro Classe I</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Padrão de instalação — consulta rápida</text>

  <rect x="48" y="156" width="300" height="78" rx="6" fill="#0B1F38"/>
  <g transform="translate(70 178)" fill="none" stroke="#C4A35A" stroke-width="1.5">
