  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Políticas públicas</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Ciclo, execução e controle</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Decisões e ações do Estado para problemas coletivos</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Interesse público, transparência e controle social</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">
    <rect x="36" y="246" width="120" height="88" rx="6" fill="#0B1F38"/>
    <text x="96" y="284" text-anchor="middle" fill="#C4A35A" font-weight="700">PROBLEMA</text>
    <text x="96" y="308" text-anchor="middle" fill="#F8F4EA">identificar</text>
    <rect x="164" y="246" width="120" height="88" rx="6" fill="#0B1F38"/>
    <text x="224" y="284" text-anchor="middle" fill="#C4A35A" font-weight="700">AGENDA</text>
    <text x="224" y="308" text-anchor="middle" fill="#F8F4EA">priorizar</text>
    <rect x="292" y="246" width="128" height="88" rx="6" fill="#0B1F38"/>
    <text x="356" y="284" text-anchor="middle" fill="#C4A35A" font-weight="700">FORMULAÇÃO</text>
    <text x="356" y="308" text-anchor="middle" fill="#F8F4EA">desenhar</text>
    <rect x="428" y="246" width="128" height="88" rx="6" fill="#0B1F38"/>
    <text x="492" y="284" text-anchor="middle" fill="#C4A35A" font-weight="700">EXECUÇÃO</text>
    <text x="492" y="308" text-anchor="middle" fill="#F8F4EA">implementar</text>
    <rect x="564" y="246" width="120" height="88" rx="6" fill="#C4A35A"/>
    <text x="624" y="284" text-anchor="middle" fill="#0B1F38" font-weight="700">AVALIAÇÃO</text>
    <text x="624" y="308" text-anchor="middle" fill="#0B1F38">medir</text>
  </g>
  <text x="360" y="358" text-anchor="middle" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">O ciclo não termina na implementação</text>

  <rect x="36" y="376" width="316" height="220" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="408" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Materialização</text>
  <line x1="56" y1="418" x2="200" y2="418" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="452" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Leis, programas</text>
  <text x="56" y="476" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">e serviços.</text>
  <text x="56" y="508" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Política não se reduz</text>
  <text x="56" y="532" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">à norma escrita.</text>
  <text x="56" y="564" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Exige execução e monitoramento.</text>

  <rect x="368" y="376" width="316" height="220" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="408" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Controle social</text>
  <line x1="388" y1="418" x2="540" y2="418" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="452" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Acompanhamento pela</text>
  <text x="388" y="476" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">sociedade.</text>
  <text x="388" y="508" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Transparência e</text>
  <text x="388" y="532" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">participação.</text>
  <text x="388" y="564" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Não é só fiscalização interna.</text>

  <rect x="36" y="614" width="648" height="116" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="650" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Exemplos no Brasil</text>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">
    <rect x="56" y="666" width="188" height="44" rx="6" fill="#0B1F38"/>
    <text x="150" y="694" text-anchor="middle" fill="#F8F4EA">SUS</text>
    <rect x="256" y="666" width="188" height="44" rx="6" fill="#0B1F38"/>
    <text x="350" y="694" text-anchor="middle" fill="#F8F4EA">SUAS</text>
    <rect x="456" y="666" width="208" height="44" rx="6" fill="#C4A35A"/>
    <text x="560" y="694" text-anchor="middle" fill="#0B1F38" font-weight="700">saneamento</text>
  </g>

  <rect x="36" y="748" width="648" height="134" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="748" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="776" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="776" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Agenda pública</text>
  <text x="56" y="820" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Problemas priorizados pelo Estado — não todos entram.</text>
  <text x="56" y="852" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Avaliação integra o ciclo: medir resultados.</text>
  <rect x="36" y="900" width="648" height="308" rx="8" fill="#0B1F38"/>
  <rect x="36" y="900" width="8" height="308" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 924)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="940" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="980" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Avaliação integra o ciclo: não termina na implementação.</text>
  <text x="64" y="1012" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Controle social é participação da sociedade.</text>
  <text x="64" y="1044" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Política pública não se reduz a lei: exige execução.</text>
  <line x1="64" y1="1076" x2="652" y2="1076" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1108" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">SUS, SUAS e saneamento básico como exemplos.</text>
  <text x="64" y="1180" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>


