<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Políticas públicas</title>
  <desc id="d">Políticas públicas: ciclo problema-agenda-formulação-implementação-avaliação; leis, programas e serviços; SUS, SUAS e saneamento.</desc>
  <defs>
