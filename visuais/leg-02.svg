<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Estatuto dos Servidores</title>
  <desc id="d">Regime jurídico do servidor municipal: provimento, vacância, direitos, deveres; estágio probatório e estabilidade.</desc>
  <defs>
    <linearGradient id="l02-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
  <path d="M24 160 h14 M24 148 v14 M696 160 h-14 M696 148 v14 M24 1206 h14 M24 1220 v-14 M696 1206 h-14 M696 1220 v-14" fill="none" stroke="#C4A35A" stroke-width="1.4"/>

  <rect width="720" height="132" fill="url(#l02-navy)"/>
  <line x1="36" y1="22" x2="128" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <line x1="592" y1="22" x2="684" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <circle cx="36" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="128" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" aria-hidden="true">
    <g transform="scale(0.0544) translate(-234 -275.3)">
      <polygon points="225,0 471,144 471,402 237,550 0,410 0,146" fill="#C4A35A"/>
      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Estatuto dos Servidores</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">LC nº 40/1992</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Regime jurídico do servidor municipal</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Lei Complementar nº 40/1992 — quórum qualificado para alteração</text>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="36" y="246" width="208" height="100" rx="6" fill="#0B1F38"/>
    <text x="140" y="286" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">PROVIMENTO</text>
    <text x="140" y="312" text-anchor="middle" fill="#F8F4EA" font-size="13">preenche o cargo</text>
    <rect x="256" y="246" width="208" height="100" rx="6" fill="#0B1F38"/>
    <text x="360" y="286" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">VACÂNCIA</text>
    <text x="360" y="312" text-anchor="middle" fill="#F8F4EA" font-size="13">cargo vago</text>
    <rect x="476" y="246" width="208" height="100" rx="6" fill="#C4A35A"/>
    <text x="580" y="286" text-anchor="middle" fill="#0B1F38" font-size="12" font-weight="700">ESTÁGIO</text>
    <text x="580" y="312" text-anchor="middle" fill="#0B1F38" font-size="13">antes da estabilidade</text>
  </g>
  <rect x="36" y="364" width="648" height="100" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="400" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Estágio probatório ≠ estabilidade</text>
  <text x="56" y="432" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Período de avaliação do servidor nomeado para cargo efetivo.</text>
  <rect x="36" y="482" width="648" height="148" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="514" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Conteúdo típico do estatuto</text>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">
    <rect x="56" y="532" width="148" height="72" rx="6" fill="#0B1F38"/>
    <text x="130" y="564" text-anchor="middle" fill="#C4A35A" font-weight="700">DIREITOS</text>
    <text x="130" y="586" text-anchor="middle" fill="#F8F4EA">vantagens</text>
    <rect x="212" y="532" width="148" height="72" rx="6" fill="#0B1F38"/>
    <text x="286" y="564" text-anchor="middle" fill="#C4A35A" font-weight="700">DEVERES</text>
    <text x="286" y="586" text-anchor="middle" fill="#F8F4EA">responsab.</text>
    <rect x="368" y="532" width="148" height="72" rx="6" fill="#0B1F38"/>
    <text x="442" y="564" text-anchor="middle" fill="#C4A35A" font-weight="700">PROVIMENTO</text>
    <text x="442" y="586" text-anchor="middle" fill="#F8F4EA">e vacância</text>
    <rect x="524" y="532" width="140" height="72" rx="6" fill="#C4A35A"/>
    <text x="594" y="564" text-anchor="middle" fill="#0B1F38" font-weight="700">ESTABILIDADE</text>
    <text x="594" y="586" text-anchor="middle" fill="#0B1F38">art. 41 CF</text>
  </g>
  <rect x="36" y="648" width="316" height="82" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="682" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Estágio probatório</text>
  <text x="56" y="708" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Avaliação que antecede a estabilidade.</text>

  <rect x="368" y="648" width="316" height="82" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="682" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Estabilidade</text>
  <text x="388" y="708" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Não é vitaliciedade: há perda do cargo.</text>
  <rect x="36" y="748" width="648" height="134" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="748" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="776" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="776" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">CF/1988, art. 41</text>
  <text x="56" y="820" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Estabilidade ao final do estágio, com aprovação. Perda do cargo nas hipóteses constitucionais.</text>
  <text x="56" y="852" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Lei Complementar nº 40/1992; CF/1988, art. 41.</text>
  <rect x="36" y="900" width="648" height="308" rx="8" fill="#0B1F38"/>
  <rect x="36" y="900" width="8" height="308" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 924)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="940" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="980" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Estágio probatório é condição para a estabilidade, mas não se confunde com ela.</text>
  <text x="64" y="1012" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Estabilidade não é vitaliciedade: há hipóteses de perda do cargo.</text>
  <text x="64" y="1044" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">A lei complementar exige quórum qualificado para alteração.</text>
  <line x1="64" y1="1076" x2="652" y2="1076" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1108" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Provimento = preenchimento do cargo; vacância = cargo sem ocupante.</text>
  <text x="64" y="1180" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#l02-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
