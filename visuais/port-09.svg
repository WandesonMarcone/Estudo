<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Sinonímia e polissemia</title>
  <desc id="d">Sinônimos têm sentido semelhante; antônimos, sentido oposto; polissemia é vários sentidos conforme o contexto. Homonímia e paronímia.</desc>
  <defs>
    <linearGradient id="p09-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
  <path d="M24 160 h14 M24 148 v14 M696 160 h-14 M696 148 v14 M24 1206 h14 M24 1220 v-14 M696 1206 h-14 M696 1220 v-14" fill="none" stroke="#C4A35A" stroke-width="1.4"/>

  <rect width="720" height="132" fill="url(#p09-navy)"/>
  <line x1="36" y1="22" x2="128" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <line x1="592" y1="22" x2="684" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <circle cx="36" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="128" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" aria-hidden="true">
    <g transform="scale(0.0544) translate(-234 -275.3)">
      <polygon points="225,0 471,144 471,402 237,550 0,410 0,146" fill="#C4A35A"/>
      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Sinonímia e polissemia</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Relações de sentido</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Relações de sentido dependem do contexto</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Raramente dois termos são totalmente equivalentes</text>

  <rect x="36" y="246" width="200" height="200" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="246" width="200" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="274" width="200" height="12" fill="#0B1F38"/>
  <text x="56" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Sinônimo</text>
  <text x="52" y="318" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Sentido semelhante.</text>
  <text x="52" y="350" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Não são intercambiáveis</text>
  <text x="52" y="370" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">em qualquer contexto.</text>
  <text x="52" y="406" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Diferenças de registro,</text>
  <text x="52" y="424" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">intensidade ou uso.</text>

  <rect x="252" y="246" width="200" height="200" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="252" y="246" width="200" height="40" rx="8" fill="#0B1F38"/>
  <rect x="252" y="274" width="200" height="12" fill="#0B1F38"/>
  <text x="272" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Antônimo</text>
  <text x="268" y="318" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Sentido oposto.</text>
  <text x="268" y="350" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Relação contextual,</text>
  <text x="268" y="370" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">não absoluta.</text>
  <text x="268" y="406" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Sinonímia e antonímia</text>
  <text x="268" y="424" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">são relativas.</text>

  <rect x="468" y="246" width="216" height="200" rx="8" fill="#0B1F38"/>
  <text x="488" y="274" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Polissemia</text>
  <text x="484" y="310" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Mesma palavra,</text>
  <text x="484" y="330" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">sentidos diferentes.</text>
  <text x="484" y="362" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Dependência do contexto.</text>
  <text x="484" y="394" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Ambiguidade pode surgir</text>
  <text x="484" y="412" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">da polissemia mal</text>
  <text x="484" y="430" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">contextualizada.</text>

  <rect x="36" y="464" width="316" height="220" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="496" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Homonímia</text>
  <line x1="56" y1="506" x2="176" y2="506" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="540" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Igual forma, sentidos distintos.</text>
  <text x="56" y="568" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Origens diferentes.</text>
  <text x="56" y="608" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Homonímia não é o mesmo</text>
  <text x="56" y="630" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">que polissemia.</text>
  <text x="56" y="658" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Formas parecidas: atenção.</text>

  <rect x="368" y="464" width="316" height="220" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="496" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Paronímia</text>
  <line x1="388" y1="506" x2="508" y2="506" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="540" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Formas próximas.</text>
  <text x="388" y="568" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Parônimos mudam o sentido.</text>
  <text x="388" y="608" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">ratificar / retificar</text>
  <text x="388" y="640" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Sinonímia imperfeita:</text>
  <text x="388" y="660" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">diferenças de uso e registro.</text>

  <rect x="36" y="702" width="648" height="194" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="702" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="730" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="730" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Relações, não equivalências absolutas</text>
  <text x="56" y="774" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Sinônimos e antônimos são relações contextuais, não absolutas.</text>
  <text x="56" y="802" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Polissemia: multiplicidade de sentidos de uma mesma palavra.</text>
  <text x="56" y="830" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Homonímia e paronímia: formas iguais ou próximas.</text>
  <text x="56" y="866" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">O contexto decide se a substituição preserva o sentido.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Sinônimos não são intercambiáveis em qualquer contexto.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Homonímia não é o mesmo que polissemia.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Parônimos como ratificar/retificar mudam o sentido.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Ambiguidade pode surgir da polissemia mal contextualizada.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#p09-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
