<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Estrutura tarifária de água e esgoto</title>
  <desc id="d">Caminho didático: consumo, categoria, faixa crescente, tarifa mínima, água e percentual de esgoto. Sem preços.</desc>
  <defs>
    <linearGradient id="h4-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
  <path d="M24 160 h14 M24 148 v14 M696 160 h-14 M696 148 v14 M24 1206 h14 M24 1220 v-14 M696 1206 h-14 M696 1220 v-14" fill="none" stroke="#C4A35A" stroke-width="1.4"/>

  <rect width="720" height="132" fill="url(#h4-navy)"/>
  <line x1="36" y1="22" x2="128" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <line x1="592" y1="22" x2="684" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <circle cx="36" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="128" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" fill="none" stroke="#C4A35A" stroke-width="1.2">
    <circle r="9"/>
    <circle r="4.5"/>
    <circle r="1.5" fill="#C4A35A" stroke="none"/>
    <line x1="-13" y1="0" x2="-10" y2="0"/>
    <line x1="10" y1="0" x2="13" y2="0"/>
    <line x1="0" y1="-13" x2="0" y2="-10"/>
    <line x1="0" y1="10" x2="0" y2="13"/>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Estrutura tarifária</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Água e esgoto — sem valores de preço</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="36" y="156" width="150" height="72" rx="6" fill="#0B1F38"/>
    <g transform="translate(52 178)" fill="none" stroke="#C4A35A" stroke-width="1.4">
      <path d="M0 8 h14"/>
      <polygon points="14,5 20,8 14,11" fill="#C4A35A" stroke="none"/>
    </g>
    <text x="80" y="186" fill="#F8F4EA" font-size="13" font-weight="700">CONSUMO</text>
    <text x="80" y="206" fill="#C4A35A" font-size="11">m³ do período</text>
    <path d="M186 192 H204" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="204,186 214,192 204,198" fill="#C4A35A"/>

    <rect x="220" y="156" width="150" height="72" rx="6" fill="#0B1F38"/>
    <g transform="translate(236 180)" fill="none" stroke="#C4A35A" stroke-width="1.4">
      <rect x="0" y="0" width="16" height="14" rx="1"/>
      <path d="M3 5 h10 M3 9 h7"/>
    </g>
    <text x="262" y="186" fill="#F8F4EA" font-size="13" font-weight="700">CATEGORIA</text>
    <text x="262" y="206" fill="#C4A35A" font-size="11">cadastro do usuário</text>
    <path d="M370 192 H388" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="388,186 398,192 388,198" fill="#C4A35A"/>

    <rect x="404" y="156" width="140" height="72" rx="6" fill="#0B1F38"/>
    <g transform="translate(420 176)" fill="none" stroke="#C4A35A" stroke-width="1.4">
      <rect x="0" y="10" width="5" height="6"/>
      <rect x="7" y="6" width="5" height="10"/>
      <rect x="14" y="2" width="5" height="14"/>
    </g>
    <text x="448" y="186" fill="#F8F4EA" font-size="13" font-weight="700">FAIXA</text>
    <text x="448" y="206" fill="#C4A35A" font-size="11">bloco de consumo</text>
    <path d="M544 192 H562" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="562,186 572,192 562,198" fill="#C4A35A"/>

    <rect x="578" y="156" width="106" height="72" rx="6" fill="#C4A35A"/>
    <text x="631" y="186" text-anchor="middle" fill="#0B1F38" font-size="12" font-weight="700">COBRANÇA</text>
    <text x="631" y="206" text-anchor="middle" fill="#0B1F38" font-size="11">água + esgoto</text>
  </g>

  <rect x="36" y="246" width="648" height="232" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Categorias (cadastro)</text>
  <line x1="56" y1="286" x2="176" y2="286" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="56" y="304" width="144" height="64" rx="6" fill="#0B1F38"/>
  <text x="128" y="342" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Residencial</text>
  <rect x="212" y="304" width="144" height="64" rx="6" fill="#0B1F38"/>
  <text x="284" y="342" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Comercial</text>
  <rect x="368" y="304" width="144" height="64" rx="6" fill="#0B1F38"/>
  <text x="440" y="342" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Industrial</text>
  <rect x="524" y="304" width="140" height="64" rx="6" fill="#0B1F38"/>
  <text x="594" y="342" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Pública</text>
  <text x="56" y="400" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">A categoria vem do cadastro. Categoria errada altera o valor.</text>
  <text x="56" y="426" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Há outras categorias possíveis; a prova cobra a lógica, não a lista.</text>
  <text x="56" y="456" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Não há preços neste cartão — só a estrutura.</text>

  <rect x="36" y="498" width="648" height="272" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="530" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Faixas crescentes (ideia)</text>
  <line x1="56" y1="540" x2="176" y2="540" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="64" y="650" width="86" height="64" rx="4" fill="#E6D7A8"/>
  <rect x="170" y="622" width="86" height="92" rx="4" fill="#D4BE7A"/>
  <rect x="276" y="588" width="86" height="126" rx="4" fill="#C4A35A"/>
  <rect x="382" y="560" width="86" height="154" rx="4" fill="#0B1F38"/>
  <text x="107" y="688" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">mínima</text>
  <text x="213" y="688" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">faixa 2</text>
  <text x="319" y="688" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">faixa 3</text>
  <text x="425" y="688" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">faixa 4</text>
  <rect x="492" y="560" width="168" height="154" rx="6" fill="#0B1F38"/>
  <text x="576" y="600" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Quanto mais</text>
  <text x="576" y="624" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">consome,</text>
  <text x="576" y="656" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">maior o preço</text>
  <text x="576" y="680" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">do m³ extra</text>
  <g fill="none" stroke="#C4A35A" stroke-width="1.35">
    <circle cx="425" cy="560" r="4"/>
    <path d="M425 560 V544 H576"/>
    <circle cx="576" cy="544" r="3"/>
  </g>
  <text x="360" y="748" text-anchor="middle" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">A mínima cobre o bloco inicial (custos fixos). O excedente sobe nas faixas.</text>

  <rect x="36" y="790" width="316" height="108" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="790" width="316" height="32" rx="6" fill="#0B1F38"/>
  <rect x="36" y="810" width="316" height="12" fill="#0B1F38"/>
  <text x="56" y="812" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Água</text>
  <text x="56" y="848" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">consumo × tarifa da faixa</text>
  <text x="56" y="872" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Mínima pode valer com 0 m³.</text>

  <rect x="368" y="790" width="316" height="108" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="368" y="790" width="316" height="32" rx="6" fill="#0B1F38"/>
  <rect x="368" y="810" width="316" height="12" fill="#0B1F38"/>
  <text x="388" y="812" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Esgoto</text>
  <text x="388" y="848" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">quando previsto: % da água</text>
  <text x="388" y="872" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Não é um volume medido à parte.</text>

  <rect x="36" y="918" width="648" height="290" rx="8" fill="#0B1F38"/>
  <rect x="36" y="918" width="8" height="290" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 942)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="958" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="998" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Faixas crescentes incentivam o uso racional.</text>
  <text x="64" y="1030" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Tarifa mínima pode ser devida mesmo sem consumo.</text>
  <line x1="64" y1="1052" x2="652" y2="1052" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1084" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Não memorize preços. Memorize a lógica:</text>
  <text x="64" y="1108" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">categoria + faixa + mínima + esgoto.</text>
  <text x="64" y="1180" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h4-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
