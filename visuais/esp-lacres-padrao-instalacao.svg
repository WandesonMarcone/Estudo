  <text x="88" y="836" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Registro na instalação</text>
  <text x="88" y="860" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Características do medidor e do lacre: identificar o equipamento</text>
  <text x="88" y="882" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">e detectar violações em inspeções futuras.</text>

