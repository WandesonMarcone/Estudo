  <text x="512" y="612" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Quem rompe</text>
  <text x="484" y="652" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Só agente autorizado.</text>
  <text x="484" y="672" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">No exercício da função.</text>
  <text x="484" y="708" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Sempre com</text>
  <text x="484" y="728" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">registro formal.</text>
  <text x="484" y="760" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Usuário não pode romper.</text>

  <rect x="36" y="802" width="648" height="96" rx="6" fill="#0B1F38"/>
