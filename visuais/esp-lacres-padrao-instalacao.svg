  <text x="296" y="612" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Violação</text>
  <text x="268" y="652" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Sem autorização:</text>
  <text x="268" y="672" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">presunção de</text>
  <text x="268" y="692" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">irregularidade.</text>
  <text x="268" y="728" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Medidas</text>
  <text x="268" y="748" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">administrativas.</text>
  <text x="268" y="768" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Com contraditório.</text>

