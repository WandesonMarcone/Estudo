    <rect x="5" y="1" width="6" height="7" rx="2" fill="none" stroke="#C4A35A" stroke-width="1.4"/>
  </g>
  <text x="76" y="612" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Função</text>
  <text x="52" y="652" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Atesta a</text>
  <text x="52" y="672" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">inviolabilidade.</text>
  <text x="52" y="708" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Indica intervenção</text>
  <text x="52" y="728" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">não autorizada.</text>
  <text x="52" y="760" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Uso obrigatório no padrão.</text>

