  <text x="552" y="384" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Lacre (amarelo)</text>
  <text x="552" y="400" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">inviolabilidade</text>
  <text x="48" y="384" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">Padrão</text>
  <text x="48" y="400" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">requisitos de montagem</text>
  <text x="360" y="560" text-anchor="middle" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Lacre integra o padrão de instalação.</text>

