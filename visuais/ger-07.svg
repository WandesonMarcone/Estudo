    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="940" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="980" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Poderes independentes e harmônicos, sem hierarquia.</text>
  <text x="64" y="1012" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Voto facultativo: 16-17, maiores de 70 e analfabetos.</text>
  <text x="64" y="1044" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">DF não é estado nem município.</text>
  <line x1="64" y1="1076" x2="652" y2="1076" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1108" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">República federativa presidencialista · 4 entes.</text>
  <text x="64" y="1180" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>


