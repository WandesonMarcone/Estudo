  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Política</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">República federativa presidencialista</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Constituição de 1988: forma de Estado e de governo</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Arts. 1º, 2º, 14 e 18 da CF/1988</text>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="36" y="246" width="208" height="108" rx="6" fill="#0B1F38"/>
    <text x="140" y="284" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">EXECUTIVO</text>
    <text x="140" y="312" text-anchor="middle" fill="#F8F4EA" font-size="14">governa</text>
    <rect x="256" y="246" width="208" height="108" rx="6" fill="#0B1F38"/>
    <text x="360" y="284" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">LEGISLATIVO</text>
    <text x="360" y="312" text-anchor="middle" fill="#F8F4EA" font-size="14">legisla</text>
    <rect x="476" y="246" width="208" height="108" rx="6" fill="#C4A35A"/>
    <text x="580" y="284" text-anchor="middle" fill="#0B1F38" font-size="12" font-weight="700">JUDICIÁRIO</text>
    <text x="580" y="312" text-anchor="middle" fill="#0B1F38" font-size="14">julga</text>
  </g>
  <text x="360" y="378" text-anchor="middle" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Independentes e harmônicos — sem hierarquia</text>

  <rect x="36" y="396" width="648" height="130" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="428" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Entes federativos</text>
  <line x1="56" y1="438" x2="200" y2="438" stroke="#C4A35A" stroke-width="1.4"/>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">
    <rect x="56" y="452" width="144" height="52" rx="6" fill="#0B1F38"/>
    <text x="128" y="484" text-anchor="middle" fill="#F8F4EA">União</text>
    <rect x="210" y="452" width="144" height="52" rx="6" fill="#0B1F38"/>
    <text x="282" y="484" text-anchor="middle" fill="#F8F4EA">Estados</text>
    <rect x="364" y="452" width="144" height="52" rx="6" fill="#0B1F38"/>
    <text x="436" y="484" text-anchor="middle" fill="#F8F4EA">DF</text>
    <rect x="518" y="452" width="146" height="52" rx="6" fill="#C4A35A"/>
    <text x="591" y="484" text-anchor="middle" fill="#0B1F38" font-weight="700">Municípios</text>
  </g>

  <rect x="36" y="544" width="316" height="196" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="576" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Voto obrigatório</text>
  <line x1="56" y1="586" x2="200" y2="586" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="620" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Maiores de 18 anos.</text>
  <text x="56" y="652" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Presidencialismo: chefe do</text>
  <text x="56" y="676" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Executivo é eleito.</text>
  <text x="56" y="712" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Federação sob a CF.</text>

  <rect x="368" y="544" width="316" height="196" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="576" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Voto facultativo</text>
  <line x1="388" y1="586" x2="530" y2="586" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="620" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">16 e 17 anos</text>
  <text x="388" y="644" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">maiores de 70 anos</text>
  <text x="388" y="668" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">analfabetos</text>
  <text x="388" y="712" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Três hipóteses, não duas.</text>

  <rect x="36" y="758" width="648" height="124" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="758" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="786" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="786" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Distrito Federal</text>
  <text x="56" y="830" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">DF não é estado nem município: tem regime próprio.</text>
  <text x="56" y="858" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Autonomia dos entes nos limites da Constituição.</text>
  <rect x="36" y="900" width="648" height="308" rx="8" fill="#0B1F38"/>
  <rect x="36" y="900" width="8" height="308" rx="4" fill="#C4A35A"/>
