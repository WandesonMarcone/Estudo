<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Política</title>
  <desc id="d">CF/1988: três Poderes independentes e harmônicos; entes União, estados, DF e municípios; voto obrigatório e facultativo.</desc>
