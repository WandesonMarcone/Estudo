<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Lei nº 9.605/1998 — Crimes ambientais</title>
  <desc id="d">Define condutas lesivas ao meio ambiente e sanções penais e administrativas, aplicáveis a pessoas físicas e jurídicas. Abrange poluição, recursos hídricos, fauna e flora.</desc>
  <defs>
    <linearGradient id="h16-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

