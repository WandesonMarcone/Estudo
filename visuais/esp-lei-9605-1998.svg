    <path d="M-4 10 Q0 4 4 10"/>
  </g>
  <text x="284" y="372" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">HÍDRICOS</text>
  <text x="284" y="392" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">uso irregular</text>
  <rect x="368" y="304" width="144" height="108" rx="6" fill="#0B1F38"/>
  <g transform="translate(440 328)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <ellipse cx="0" cy="10" rx="10" ry="6"/>
    <circle cx="-4" cy="8" r="1.4" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="440" y="372" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">FAUNA</text>
  <text x="440" y="392" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">danos</text>
  <rect x="524" y="304" width="136" height="108" rx="6" fill="#0B1F38"/>
  <g transform="translate(592 324)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <path d="M0 16 L0 4 M0 4 L-6 10 M0 4 L6 10"/>
    <circle cx="0" cy="2" r="2"/>
  </g>
  <text x="592" y="372" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">FLORA</text>
  <text x="592" y="392" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">danos</text>
  <text x="56" y="448" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">A lei define crimes e sanções por essas condutas.</text>

  <rect x="36" y="496" width="316" height="196" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="496" width="316" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="524" width="316" height="12" fill="#0B1F38"/>
  <text x="56" y="524" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Quem responde</text>
  <rect x="56" y="556" width="132" height="64" rx="6" fill="#0B1F38"/>
  <text x="122" y="594" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Pessoa física</text>
  <rect x="200" y="556" width="132" height="64" rx="6" fill="#C4A35A"/>
  <text x="266" y="594" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Pessoa jurídica</text>
  <text x="56" y="650" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">PJ também pode ser responsabilizada.</text>
  <text x="56" y="672" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Não é só a pessoa física.</text>

  <rect x="368" y="496" width="316" height="196" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="368" y="496" width="316" height="40" rx="8" fill="#0B1F38"/>
  <rect x="368" y="524" width="316" height="12" fill="#0B1F38"/>
  <text x="388" y="524" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Duas naturezas</text>
  <text x="388" y="572" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Penal: imputação de pena.</text>
  <text x="388" y="596" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Administrativa: multa e medidas.</text>
  <text x="388" y="636" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Não é apenas sanção civil.</text>
  <text x="388" y="660" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Natureza penal e administrativa.</text>

  <rect x="36" y="710" width="648" height="186" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="740" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Sanções previstas</text>
  <line x1="56" y1="750" x2="176" y2="750" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="56" y="766" width="148" height="56" rx="6" fill="#0B1F38"/>
  <text x="130" y="800" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">privativa de liberdade</text>
  <rect x="216" y="766" width="148" height="56" rx="6" fill="#0B1F38"/>
  <text x="290" y="800" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">restritiva de direitos</text>
  <rect x="376" y="766" width="132" height="56" rx="6" fill="#0B1F38"/>
  <text x="442" y="800" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">multas</text>
  <rect x="520" y="766" width="140" height="56" rx="6" fill="#C4A35A"/>
  <text x="590" y="800" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">administrativas</text>
  <text x="56" y="854" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Não confundir com a PNMA (Lei 6.938/1981) nem com o Código Florestal.</text>
  <text x="56" y="876" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Sanção administrativa: penalidade da administração, como multa.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Define crimes e sanções por condutas lesivas ao ambiente.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Aplica-se a pessoas físicas e jurídicas.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Natureza penal e administrativa — não só civil.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Não confundir com PNMA (Lei 6.938/1981) nem Código Florestal.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h16-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
