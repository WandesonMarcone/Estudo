  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Lei nº 9.605/1998</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Crimes ambientais — sanções penais e administrativas</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <g transform="translate(56 176)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Condutas lesivas ao meio ambiente</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Crime ambiental: conduta tipificada em lei</text>

  <rect x="36" y="246" width="648" height="232" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Temas principais</text>
  <line x1="56" y1="286" x2="176" y2="286" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="56" y="304" width="144" height="108" rx="6" fill="#0B1F38"/>
  <g transform="translate(118 328)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <circle cx="0" cy="8" r="8"/>
    <path d="M-4 8 h8"/>
  </g>
  <text x="128" y="372" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">POLUIÇÃO</text>
  <text x="128" y="392" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">infração ambiental</text>
  <rect x="212" y="304" width="144" height="108" rx="6" fill="#0B1F38"/>
  <g transform="translate(284 328)" fill="none" stroke="#C4A35A" stroke-width="1.5">
