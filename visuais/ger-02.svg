      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Geografia de Uberlândia</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Triângulo Mineiro, Cerrado e Paranaíba</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Oeste de Minas · Triângulo Mineiro</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Planalto entre 800 e 900 metros</text>

  <rect x="36" y="246" width="208" height="150" rx="8" fill="#0B1F38"/>
  <text x="140" y="280" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">CLIMA</text>
  <text x="140" y="312" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Tropical</text>
  <text x="140" y="336" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">inverno seco</text>
  <text x="140" y="368" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">≠ equatorial úmido</text>

  <rect x="256" y="246" width="208" height="150" rx="8" fill="#0B1F38"/>
  <text x="360" y="280" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">BIOMA</text>
  <text x="360" y="312" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Cerrado</text>
  <text x="360" y="336" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">vegetação original</text>
  <text x="360" y="368" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">centro do Brasil</text>

  <rect x="476" y="246" width="208" height="150" rx="8" fill="#C4A35A"/>
  <text x="580" y="280" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">FUNÇÃO</text>
  <text x="580" y="312" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Entroncamento</text>
  <text x="580" y="336" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">rodoviário</text>
  <text x="580" y="368" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">interior do país</text>

  <rect x="36" y="414" width="648" height="168" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="448" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Hidrografia em cascata</text>
  <line x1="56" y1="458" x2="260" y2="458" stroke="#C4A35A" stroke-width="1.4"/>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="56" y="478" width="176" height="80" rx="6" fill="#0B1F38"/>
    <text x="144" y="512" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">UBERABINHA</text>
    <text x="144" y="536" text-anchor="middle" fill="#F8F4EA" font-size="13">rio urbano/local</text>
    <path d="M232 518 H256" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="256,512 268,518 256,524" fill="#C4A35A"/>
    <rect x="272" y="478" width="176" height="80" rx="6" fill="#0B1F38"/>
    <text x="360" y="512" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">PARANAÍBA</text>
    <text x="360" y="536" text-anchor="middle" fill="#F8F4EA" font-size="13">bacia intermediária</text>
    <path d="M448 518 H472" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="472,512 484,518 472,524" fill="#C4A35A"/>
    <rect x="488" y="478" width="176" height="80" rx="6" fill="#C4A35A"/>
    <text x="576" y="512" text-anchor="middle" fill="#0B1F38" font-size="12" font-weight="700">PARANÁ</text>
    <text x="576" y="536" text-anchor="middle" fill="#0B1F38" font-size="13">bacia maior</text>
  </g>

  <rect x="36" y="600" width="316" height="140" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="632" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Relevo</text>
  <line x1="56" y1="642" x2="140" y2="642" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="676" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Planalto: elevado e relativamente plano.</text>
  <text x="56" y="708" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Típico do interior.</text>

  <rect x="368" y="600" width="316" height="140" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="632" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Termos</text>
  <line x1="388" y1="642" x2="480" y2="642" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="676" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Planalto · Cerrado · Bacia</text>
  <text x="388" y="708" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Área drenada por um rio.</text>

  <rect x="36" y="758" width="648" height="124" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="796" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Uberabinha é urbano e local</text>
  <text x="56" y="828" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Não confundir com rios de abrangência estadual.</text>
  <text x="56" y="856" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Clima tropical com inverno seco difere do equatorial da Amazônia.</text>
  <rect x="36" y="900" width="648" height="308" rx="8" fill="#0B1F38"/>
  <rect x="36" y="900" width="8" height="308" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 924)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="940" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="980" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Paranaíba é afluente da bacia do Paraná: não são a mesma.</text>
  <text x="64" y="1012" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Clima tropical com inverno seco ≠ equatorial da Amazônia.</text>
  <text x="64" y="1044" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Cerrado é a vegetação original predominante.</text>
  <line x1="64" y1="1076" x2="652" y2="1076" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1108" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Uberabinha → Paranaíba → Paraná.</text>
  <text x="64" y="1180" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>


  <rect x="0" y="1260" width="720" height="60" fill="url(#g02-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
