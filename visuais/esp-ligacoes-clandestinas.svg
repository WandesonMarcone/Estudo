  <text x="76" y="722" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">1. Registrar</text>
  <text x="52" y="760" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Documentar os fatos.</text>
  <text x="52" y="780" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Instruir o processo.</text>
  <text x="52" y="816" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Toda constatação</text>
  <text x="52" y="836" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">deve ser documentada.</text>
  <text x="52" y="868" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Sem iniciativas pessoais.</text>

  <rect x="252" y="698" width="200" height="196" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="252" y="698" width="200" height="36" rx="6" fill="#0B1F38"/>
  <rect x="252" y="722" width="200" height="12" fill="#0B1F38"/>
