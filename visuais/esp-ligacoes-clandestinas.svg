  <text x="516" y="332" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">LIGAÇÃO CLANDESTINA</text>
  <rect x="392" y="348" width="48" height="28" rx="3" fill="#173B5F"/>
  <text x="416" y="366" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700">REDE</text>
