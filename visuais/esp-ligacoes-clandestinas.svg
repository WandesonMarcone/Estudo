  </g>
  <text x="296" y="722" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">2. Encaminhar</text>
  <text x="268" y="760" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Setor competente.</text>
  <text x="268" y="780" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Rito da autarquia.</text>
  <text x="268" y="816" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Medidas previstas</text>
  <text x="268" y="836" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">na norma.</text>
  <text x="268" y="868" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Regularização: adequar a ligação.</text>

  <rect x="468" y="698" width="216" height="196" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="468" y="698" width="216" height="36" rx="6" fill="#0B1F38"/>
  <rect x="468" y="722" width="216" height="12" fill="#0B1F38"/>
  <g transform="translate(484 708)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <circle cx="8" cy="8" r="7"/>
