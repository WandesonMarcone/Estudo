  </g>
  <text x="508" y="722" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">3. Vedado</text>
  <text x="484" y="760" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Receber valores</text>
  <text x="484" y="780" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">em campo.</text>
  <text x="484" y="816" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Não negociar</text>
  <text x="484" y="836" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">informalmente.</text>
  <text x="484" y="868" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Sem competência para cobrar.</text>

