  <text x="56" y="490" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Diferença central: existir ou não autorização/contrato e medição.</text>

  <rect x="36" y="532" width="648" height="148" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="564" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Fiscalização</text>
  <line x1="56" y1="574" x2="176" y2="574" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="604" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Identifica irregularidades e clandestinidades.</text>
  <text x="56" y="628" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Coíbe fraudes e mantém cadastro e cobrança regulares.</text>
  <text x="56" y="656" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Clandestina difere de ligação irregular regularizável.</text>

  <rect x="36" y="698" width="200" height="196" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="698" width="200" height="36" rx="6" fill="#0B1F38"/>
  <rect x="36" y="722" width="200" height="12" fill="#0B1F38"/>
