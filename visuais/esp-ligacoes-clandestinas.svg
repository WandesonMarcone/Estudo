  <text x="578" y="366" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="10" font-weight="700">SEM MEDIDOR</text>
  <text x="516" y="428" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">sem anuência + sem medição</text>

