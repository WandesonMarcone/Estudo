<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Cálculo de consumo e conversão de volume</title>
  <desc id="d">Consumo é leitura atual menos anterior. 1 m³ equivale a 1.000 litros. Exemplo didático sem tarifas reais.</desc>
  <defs>
    <linearGradient id="h3-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
  <path d="M24 160 h14 M24 148 v14 M696 160 h-14 M696 148 v14 M24 1206 h14 M24 1220 v-14 M696 1206 h-14 M696 1220 v-14" fill="none" stroke="#C4A35A" stroke-width="1.4"/>

  <rect width="720" height="132" fill="url(#h3-navy)"/>
  <line x1="36" y1="22" x2="128" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <line x1="592" y1="22" x2="684" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <circle cx="36" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="128" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" aria-hidden="true">
    <g transform="scale(0.0544) translate(-234 -275.3)">
      <polygon points="225,0 471,144 471,402 237,550 0,410 0,146" fill="#C4A35A"/>
      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Cálculo de consumo</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">e conversão de volume</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <g transform="translate(56 178)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <path d="M0 8 h18"/>
    <polygon points="18,5 24,8 18,11" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="700">consumo = atual − anterior</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Sempre a diferença das leituras do período</text>

  <rect x="36" y="248" width="188" height="150" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="248" width="188" height="36" rx="6" fill="#0B1F38"/>
  <rect x="36" y="272" width="188" height="12" fill="#0B1F38"/>
  <text x="130" y="272" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">LEITURA ANTERIOR</text>
  <text x="130" y="340" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700">110</text>
  <text x="130" y="372" text-anchor="middle" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">m³  (exemplo)</text>

  <g transform="translate(248 323)" fill="none" stroke="#C4A35A" stroke-width="2">
    <path d="M0 0 h28"/>
    <polygon points="28,-6 40,0 28,6" fill="#C4A35A" stroke="none"/>
  </g>

  <rect x="296" y="248" width="188" height="150" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.6"/>
  <rect x="296" y="248" width="188" height="36" rx="6" fill="#0B1F38"/>
  <rect x="296" y="272" width="188" height="12" fill="#0B1F38"/>
  <text x="390" y="272" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">LEITURA ATUAL</text>
  <text x="390" y="340" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700">124</text>
  <text x="390" y="372" text-anchor="middle" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">m³  (exemplo)</text>

  <text x="508" y="332" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="700">=</text>

  <rect x="532" y="248" width="152" height="150" rx="6" fill="#0B1F38"/>
  <text x="608" y="280" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">CONSUMO</text>
  <text x="608" y="340" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="40" font-weight="700">14</text>
  <text x="608" y="372" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">m³</text>

  <g fill="none" stroke="#C4A35A" stroke-width="1.35">
    <circle cx="608" cy="248" r="4"/>
    <path d="M608 248 V228 H360 V216"/>
    <circle cx="360" cy="216" r="3"/>
  </g>

  <rect x="36" y="418" width="648" height="210" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="450" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Conversão básica</text>
  <line x1="56" y1="460" x2="176" y2="460" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="56" y="480" width="300" height="122" rx="6" fill="#0B1F38"/>
  <g transform="translate(76 508)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <path d="M0 8 h14 M7 1 v14"/>
    <rect x="18" y="2" width="12" height="12" rx="1"/>
  </g>
  <text x="206" y="534" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="24" font-weight="700">1 m³ = 1.000 L</text>
  <text x="206" y="566" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">metro cúbico ↔ litros</text>
  <rect x="372" y="480" width="288" height="122" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.2"/>
  <text x="516" y="522" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Exemplo: 14 m³</text>
  <text x="516" y="550" text-anchor="middle" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="17" font-weight="700">14 × 1.000 = 14.000 L</text>
  <text x="516" y="576" text-anchor="middle" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Litros → m³: dividir por 1.000</text>

  <rect x="36" y="648" width="648" height="240" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="648" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="676" width="648" height="12" fill="#0B1F38"/>
  <g transform="translate(56 662)" fill="none" stroke="#C4A35A" stroke-width="1.4">
    <rect x="0" y="2" width="16" height="12" rx="1"/>
    <path d="M3 6 h10 M3 10 h6"/>
  </g>
  <text x="84" y="676" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Da conta (ideia, sem preço)</text>
  <text x="56" y="720" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">1. Obter o consumo em m³.</text>
  <text x="56" y="752" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">2. Converter litros em m³ se a questão vier em litros.</text>
  <text x="56" y="784" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">3. Valor da água = consumo × preço do m³ da faixa.</text>
  <text x="56" y="816" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">4. Esgoto, quando previsto, é percentual sobre a água.</text>
  <text x="56" y="856" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Pode haver tarifa mínima mesmo com consumo baixo ou zero.</text>
  <text x="56" y="876" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Números deste cartão são só exemplo de cálculo.</text>

  <rect x="36" y="908" width="648" height="300" rx="8" fill="#0B1F38"/>
  <rect x="36" y="908" width="8" height="300" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 932)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="948" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="988" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Converter litros em m³ antes de calcular (÷ 1.000).</text>
  <text x="64" y="1020" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Usar a faixa tarifária do consumo, não uma tarifa única.</text>
  <text x="64" y="1052" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Não inventar preço: a questão informa o valor do m³.</text>
  <line x1="64" y1="1072" x2="652" y2="1072" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1104" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Números deste cartão são só exemplo de cálculo.</text>
  <text x="64" y="1178" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h3-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
