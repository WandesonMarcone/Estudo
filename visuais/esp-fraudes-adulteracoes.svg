  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Fraudes e adulterações</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Interferência indevida na medição</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <g transform="translate(56 176)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Fraude: ação que altere ou impeça a medição</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Adulteração: modificação indevida do medidor</text>

  <rect x="36" y="246" width="648" height="268" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Exemplos de fraude</text>
  <line x1="56" y1="286" x2="176" y2="286" stroke="#C4A35A" stroke-width="1.4"/>

  <rect x="56" y="304" width="144" height="132" rx="6" fill="#0B1F38"/>
  <g transform="translate(118 328)">
    <rect x="-8" y="8" width="16" height="20" rx="2" fill="url(#h7-gold)"/>
    <rect x="-5" y="-4" width="10" height="14" rx="4" fill="none" stroke="#C4A35A" stroke-width="1.6"/>
    <line x1="-10" y1="-2" x2="10" y2="22" stroke="#F8F4EA" stroke-width="2.2"/>
  </g>
  <text x="128" y="390" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">LACRE</text>
  <text x="128" y="410" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">rompido</text>

  <rect x="212" y="304" width="144" height="132" rx="6" fill="#0B1F38"/>
  <g transform="translate(284 340)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M-10 8 L0 -8 L10 8 Z"/>
    <circle cx="0" cy="10" r="6"/>
    <path d="M0 4 v4"/>
  </g>
  <text x="284" y="390" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">ÍMÃ</text>
  <text x="284" y="410" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">freia a contagem</text>

  <rect x="368" y="304" width="144" height="132" rx="6" fill="#0B1F38"/>
  <g transform="translate(440 336)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M-14 0 h10"/>
    <polygon points="-4,-5 6,0 -4,5" fill="#C4A35A" stroke="none"/>
    <path d="M14 16 h-10"/>
    <polygon points="4,11 -6,16 4,21" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="440" y="390" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">INVERSÃO</text>
  <text x="440" y="410" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">do medidor</text>

  <rect x="524" y="304" width="136" height="132" rx="6" fill="#0B1F38"/>
  <g transform="translate(592 336)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <rect x="-16" y="0" width="12" height="16" rx="1"/>
    <path d="M-4 8 H16"/>
    <circle cx="4" cy="8" r="3"/>
  </g>
  <text x="592" y="390" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">LIGAÇÃO</text>
  <text x="592" y="410" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">direta</text>

  <text x="56" y="468" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Ligação direta: derivação antes do hidrômetro.</text>
  <text x="56" y="492" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Nem toda leitura menor é fraude: pode ser troca ou virada.</text>

  <rect x="36" y="532" width="648" height="248" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="564" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Conduta do agente</text>
  <line x1="56" y1="574" x2="176" y2="574" stroke="#C4A35A" stroke-width="1.4"/>

  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="56" y="592" width="150" height="72" rx="6" fill="#0B1F38"/>
    <text x="131" y="622" text-anchor="middle" fill="#F8F4EA" font-size="13" font-weight="700">1. REGISTRAR</text>
    <text x="131" y="644" text-anchor="middle" fill="#C4A35A" font-size="11">data, leitura, evidências</text>
    <path d="M206 628 H224" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="224,622 234,628 224,634" fill="#C4A35A"/>

    <rect x="240" y="592" width="150" height="72" rx="6" fill="#0B1F38"/>
    <text x="315" y="622" text-anchor="middle" fill="#F8F4EA" font-size="13" font-weight="700">2. ENCAMINHAR</text>
    <text x="315" y="644" text-anchor="middle" fill="#C4A35A" font-size="11">rito da norma</text>
    <path d="M390 628 H408" stroke="#C4A35A" stroke-width="1.4"/>
    <polygon points="408,622 418,628 408,634" fill="#C4A35A"/>

    <rect x="424" y="592" width="236" height="72" rx="6" fill="#C4A35A"/>
    <text x="542" y="622" text-anchor="middle" fill="#0B1F38" font-size="13" font-weight="700">3. NÃO ALTERAR</text>
    <text x="542" y="644" text-anchor="middle" fill="#0B1F38" font-size="11">nem negociar em campo</text>
  </g>
  <text x="56" y="696" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Irregularidade: situação em desacordo com as normas.</text>
  <text x="56" y="720" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">O agente não altera o equipamento nem negocia com o usuário.</text>
  <text x="56" y="752" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Registrar data, leitura e evidências valida o procedimento.</text>

  <rect x="36" y="798" width="316" height="100" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="798" width="316" height="32" rx="6" fill="#0B1F38"/>
  <rect x="36" y="818" width="316" height="12" fill="#0B1F38"/>
  <text x="56" y="820" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Efeitos</text>
  <text x="56" y="856" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Perda de receita.</text>
  <text x="56" y="878" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Distorção no planejamento do sistema.</text>

  <rect x="368" y="798" width="316" height="100" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="368" y="798" width="316" height="32" rx="6" fill="#0B1F38"/>
  <rect x="368" y="818" width="316" height="12" fill="#0B1F38"/>
  <text x="388" y="820" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Não é fraude</text>
  <text x="388" y="856" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Troca ou virada do medidor.</text>
  <text x="388" y="878" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Leitura menor, por si só, não prova.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Fraude: qualquer ação que altere ou impeça a medição.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Conduta: registrar e encaminhar conforme a norma.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Não alterar o equipamento nem negociar em campo.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Efeitos: perda de receita e distorção do planejamento.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h7-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
