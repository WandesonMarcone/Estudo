<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Fraudes e adulterações</title>
  <desc id="d">Fraude é interferência na medição. Exemplos: lacre rompido, ímã, inversão e ligação direta. Conduta: registrar e encaminhar.</desc>
  <defs>
    <linearGradient id="h7-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
    <linearGradient id="h7-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E2C56A"/>
      <stop offset="1" stop-color="#9A7420"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
