<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Determinantes</title>
  <desc id="d">Determinante é número associado a matriz quadrada. Ordem 2: ad − bc. Ordem 3: Sarrus. Zero indica matriz singular.</desc>
  <defs>
    <linearGradient id="m19-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
  <path d="M24 160 h14 M24 148 v14 M696 160 h-14 M696 148 v14 M24 1206 h14 M24 1220 v-14 M696 1206 h-14 M696 1220 v-14" fill="none" stroke="#C4A35A" stroke-width="1.4"/>

  <rect width="720" height="132" fill="url(#m19-navy)"/>
  <line x1="36" y1="22" x2="128" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <line x1="592" y1="22" x2="684" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <circle cx="36" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="128" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" aria-hidden="true">
    <g transform="scale(0.0544) translate(-234 -275.3)">
      <polygon points="225,0 471,144 471,402 237,550 0,410 0,146" fill="#C4A35A"/>
      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Determinantes</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Ordem 2, Sarrus e singularidade</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Número associado a matriz quadrada</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">|A| ≠ 0: sistema com solução única. |A| = 0: matriz singular</text>

  <rect x="36" y="246" width="200" height="248" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="246" width="200" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="274" width="200" height="12" fill="#0B1F38"/>
  <text x="56" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Ordem 2</text>
  <text x="52" y="318" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Matriz [[a b] [c d]]</text>
  <text x="52" y="354" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700">|A| = ad − bc</text>
  <text x="52" y="398" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Principal menos</text>
  <text x="52" y="418" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">secundária.</text>
  <text x="52" y="454" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Ex.: |2 3; 1 4| = 5.</text>
  <text x="52" y="474" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Cuidado com o sinal.</text>

  <rect x="252" y="246" width="200" height="248" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="252" y="246" width="200" height="40" rx="8" fill="#0B1F38"/>
  <rect x="252" y="274" width="200" height="12" fill="#0B1F38"/>
  <text x="272" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Sarrus (3×3)</text>
  <text x="268" y="318" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Repetir 2 colunas</text>
  <text x="268" y="338" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">à direita.</text>
  <text x="268" y="374" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">+ três diagonais</text>
  <text x="268" y="394" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">principais.</text>
  <text x="268" y="426" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">− três secundárias.</text>
  <text x="268" y="462" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Só para ordem 3.</text>
  <text x="268" y="478" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Sinais na secundária.</text>

  <rect x="468" y="246" width="216" height="248" rx="8" fill="#0B1F38"/>
  <text x="488" y="274" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Singular</text>
  <text x="484" y="310" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">|A| = 0: singular.</text>
  <text x="484" y="334" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Não tem inversa.</text>
  <text x="484" y="370" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">|A| ≠ 0: solução</text>
  <text x="484" y="390" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">única no sistema.</text>
  <text x="484" y="426" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Zero não implica</text>
  <text x="484" y="446" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">zero soluções.</text>
  <text x="484" y="478" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Só matriz quadrada tem |A|.</text>

  <rect x="36" y="512" width="648" height="176" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="544" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Propriedades úteis</text>
  <line x1="56" y1="554" x2="176" y2="554" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="588" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Trocar duas linhas (ou colunas) troca o sinal de |A|.</text>
  <text x="56" y="616" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Linha nula ou duas iguais: determinante zero.</text>
  <text x="56" y="644" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">|A·B| = |A| · |B|. |At| = |A|.</text>
  <text x="56" y="672" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Determinante nulo: sistema sem solução única.</text>

  <rect x="36" y="706" width="648" height="190" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="706" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="734" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="734" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Relação com sistemas</text>
  <text x="56" y="778" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">|A| ≠ 0: possível e determinado (solução única).</text>
  <text x="56" y="806" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">|A| = 0: indeterminado ou impossível.</text>
  <text x="56" y="834" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Não existe determinante de matriz não quadrada.</text>
  <text x="56" y="870" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Na secundária, o sinal é negativo: ad − bc.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Cuidado com os sinais na diagonal secundária.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Determinante só existe para matriz quadrada.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">|A| = 0 não significa necessariamente zero soluções.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Ordem 2: ad − bc. Ordem 3: Sarrus. Singular: |A| = 0.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#m19-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
