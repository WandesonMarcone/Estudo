<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Números</title>
  <desc id="d">Conjuntos numéricos: naturais, inteiros, racionais, irracionais e reais. ℕ ⊂ ℤ ⊂ ℚ ⊂ ℝ. MMC, MDC e propriedades das operações.</desc>
  <defs>
    <linearGradient id="m02-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
