  <text x="138" y="380" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ECONOMIA 1</text>
  <text x="138" y="404" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">unidade autônoma</text>
  <rect x="216" y="340" width="132" height="104" rx="6" fill="#0B1F38"/>
  <text x="282" y="380" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ECONOMIA 2</text>
  <text x="282" y="404" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">unidade autônoma</text>
  <rect x="360" y="340" width="132" height="104" rx="6" fill="#0B1F38"/>
  <text x="426" y="380" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ECONOMIA 3</text>
  <text x="426" y="404" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">unidade autônoma</text>
  <rect x="504" y="340" width="140" height="104" rx="6" fill="#C4A35A"/>
  <text x="574" y="380" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ECONOMIA n</text>
  <text x="574" y="404" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">cada uma faturada</text>
  <text x="360" y="496" text-anchor="middle" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Economia não se confunde com matrícula do imóvel.</text>

  <rect x="36" y="544" width="648" height="148" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="576" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Classificação (categoria tarifária)</text>
  <line x1="56" y1="586" x2="176" y2="586" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="56" y="600" width="140" height="52" rx="6" fill="#0B1F38"/>
  <text x="126" y="632" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Residencial</text>
  <rect x="208" y="600" width="140" height="52" rx="6" fill="#0B1F38"/>
  <text x="278" y="632" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Comercial</text>
  <rect x="360" y="600" width="140" height="52" rx="6" fill="#0B1F38"/>
  <text x="430" y="632" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Industrial</text>
  <rect x="512" y="600" width="148" height="52" rx="6" fill="#0B1F38"/>
  <text x="586" y="632" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Pública etc.</text>
  <text x="56" y="674" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Classificação define o tratamento tarifário.</text>

  <rect x="36" y="710" width="200" height="186" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="710" width="200" height="36" rx="6" fill="#0B1F38"/>
  <rect x="36" y="734" width="200" height="12" fill="#0B1F38"/>
  <text x="56" y="734" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Economia</text>
  <text x="52" y="774" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Unidade autônoma</text>
  <text x="52" y="794" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">passível de consumo</text>
  <text x="52" y="814" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">de água.</text>
  <text x="52" y="850" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Não é a matrícula.</text>
  <text x="52" y="872" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Faturada à parte.</text>

  <rect x="252" y="710" width="200" height="186" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="252" y="710" width="200" height="36" rx="6" fill="#0B1F38"/>
  <rect x="252" y="734" width="200" height="12" fill="#0B1F38"/>
  <text x="272" y="734" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Usuário</text>
  <text x="268" y="774" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Titular do imóvel</text>
  <text x="268" y="794" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">ou responsável</text>
  <text x="268" y="814" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">pela ligação.</text>
  <text x="268" y="850" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Cadastro atualizado.</text>
  <text x="268" y="872" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Evita cobrança indevida.</text>

  <rect x="468" y="710" width="216" height="186" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="468" y="710" width="216" height="36" rx="6" fill="#0B1F38"/>
  <rect x="468" y="734" width="216" height="12" fill="#0B1F38"/>
  <text x="488" y="734" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Uso real</text>
  <text x="484" y="774" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Orienta a classificação.</text>
  <text x="484" y="794" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Não só a declaração.</text>
  <text x="484" y="830" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Mudança de uso ou</text>
  <text x="484" y="850" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">nova unidade:</text>
  <text x="484" y="872" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">atualizar o cadastro.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
