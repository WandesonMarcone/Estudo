<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Cadastro e classificação de economias</title>
  <desc id="d">Economia é unidade autônoma de consumo. Classificação define a tarifa. Um terreno pode ter várias economias. Uso real orienta a classificação.</desc>
