<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Registro de consumo</title>
  <desc id="d">Consumo é a diferença entre leituras. Sem leitura, estima-se pela média histórica e ajusta-se quando a leitura for retomada.</desc>
  <defs>
    <linearGradient id="h6-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
  <path d="M24 160 h14 M24 148 v14 M696 160 h-14 M696 148 v14 M24 1206 h14 M24 1220 v-14 M696 1206 h-14 M696 1220 v-14" fill="none" stroke="#C4A35A" stroke-width="1.4"/>

  <rect width="720" height="132" fill="url(#h6-navy)"/>
  <line x1="36" y1="22" x2="128" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <line x1="592" y1="22" x2="684" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <circle cx="36" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="128" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" aria-hidden="true">
    <g transform="scale(0.0544) translate(-234 -275.3)">
      <polygon points="225,0 471,144 471,402 237,550 0,410 0,146" fill="#C4A35A"/>
      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Registro de consumo</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Leitura, estimativa e ajuste</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <g transform="translate(56 178)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <path d="M0 8 h18"/>
    <polygon points="18,5 24,8 18,11" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="20" font-weight="700">consumo = atual − anterior</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Diferença das leituras do período</text>

  <rect x="36" y="246" width="648" height="232" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Com leitura</text>
  <line x1="56" y1="286" x2="176" y2="286" stroke="#C4A35A" stroke-width="1.4"/>

  <rect x="56" y="304" width="168" height="88" rx="6" fill="#0B1F38"/>
  <text x="140" y="340" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ANTERIOR</text>
  <text x="140" y="366" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">leitura</text>
  <g transform="translate(236 348)" fill="none" stroke="#C4A35A" stroke-width="2">
    <path d="M0 0 h22"/>
    <polygon points="22,-6 34,0 22,6" fill="#C4A35A" stroke="none"/>
  </g>
  <rect x="278" y="304" width="168" height="88" rx="6" fill="#0B1F38"/>
  <text x="362" y="340" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ATUAL</text>
  <text x="362" y="366" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">leitura</text>
  <text x="470" y="352" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" font-weight="700">=</text>
  <rect x="500" y="304" width="160" height="88" rx="6" fill="#C4A35A"/>
  <text x="580" y="340" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">CONSUMO</text>
  <text x="580" y="366" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">medido</text>
  <text x="56" y="430" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Leitura: registro dos algarismos do hidrômetro em determinada data.</text>
  <text x="56" y="454" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Consumo negativo indica erro de leitura ou troca do medidor.</text>

  <rect x="36" y="496" width="648" height="272" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="528" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Sem leitura — caminho provisório</text>
  <line x1="56" y1="538" x2="176" y2="538" stroke="#C4A35A" stroke-width="1.4"/>

  <rect x="56" y="556" width="168" height="96" rx="6" fill="#0B1F38"/>
  <g transform="translate(72 572)" fill="none" stroke="#C4A35A" stroke-width="1.4">
    <circle cx="8" cy="8" r="7"/>
    <path d="M8 5 v4 h3"/>
  </g>
  <text x="140" y="592" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">1. MÉDIA</text>
  <text x="140" y="614" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">histórica</text>
  <text x="140" y="634" text-anchor="middle" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">base da estimativa</text>
  <g transform="translate(236 604)" fill="none" stroke="#C4A35A" stroke-width="2">
    <path d="M0 0 h22"/>
    <polygon points="22,-6 34,0 22,6" fill="#C4A35A" stroke="none"/>
  </g>
  <rect x="278" y="556" width="168" height="96" rx="6" fill="#0B1F38"/>
  <g transform="translate(294 572)" fill="none" stroke="#C4A35A" stroke-width="1.4">
    <rect x="0" y="2" width="16" height="12" rx="1"/>
    <path d="M3 6 h10 M3 10 h6"/>
  </g>
  <text x="362" y="592" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">2. ESTIMATIVA</text>
  <text x="362" y="614" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">fatura provisória</text>
  <text x="362" y="634" text-anchor="middle" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">não é definitiva</text>
  <g transform="translate(458 604)" fill="none" stroke="#C4A35A" stroke-width="2">
    <path d="M0 0 h22"/>
    <polygon points="22,-6 34,0 22,6" fill="#C4A35A" stroke="none"/>
  </g>
  <rect x="500" y="556" width="160" height="96" rx="6" fill="#C4A35A"/>
  <text x="580" y="592" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">3. AJUSTE</text>
  <text x="580" y="614" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">leitura retomada</text>
  <text x="580" y="634" text-anchor="middle" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">estimado × medido</text>
  <text x="56" y="686" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Ajuste: correção pela diferença entre estimado e medido.</text>
  <text x="56" y="710" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">A média é referência técnica, não valor definitivo faturado.</text>
  <text x="56" y="746" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Leitura não pode ser substituída definitivamente por estimativa.</text>

  <rect x="36" y="788" width="200" height="108" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="788" width="200" height="32" rx="6" fill="#0B1F38"/>
  <rect x="36" y="808" width="200" height="12" fill="#0B1F38"/>
  <text x="56" y="810" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Leitura</text>
  <text x="56" y="846" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Algarismos do</text>
  <text x="56" y="866" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">hidrômetro na data.</text>

  <rect x="252" y="788" width="208" height="108" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="252" y="788" width="208" height="32" rx="6" fill="#0B1F38"/>
  <rect x="252" y="808" width="208" height="12" fill="#0B1F38"/>
  <text x="272" y="810" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Estimativa</text>
  <text x="272" y="846" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Média quando não</text>
  <text x="272" y="866" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">há leitura.</text>

  <rect x="476" y="788" width="208" height="108" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="476" y="788" width="208" height="32" rx="6" fill="#0B1F38"/>
  <rect x="476" y="808" width="208" height="12" fill="#0B1F38"/>
  <text x="496" y="810" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Média</text>
  <text x="496" y="846" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Alerta para consumo</text>
  <text x="496" y="866" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">fora do padrão.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Consumo = leitura atual − leitura anterior.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Sem leitura: estimativa por média, com ajuste posterior.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Estimativa é provisória — a leitura não é substituída.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Consumo negativo: erro de leitura ou troca do medidor.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h6-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
