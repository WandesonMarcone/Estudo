  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Decreto 19.545/2021</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Tarifas de água e esgoto — DMAE</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <g transform="translate(56 176)" fill="none" stroke="#C4A35A" stroke-width="1.5">
    <circle cx="8" cy="8" r="7"/>
    <path d="M8 4 v5 M8 12 v0.5"/>
  </g>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Composição, categorias, reajuste e revisão</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Modicidade conciliada com equilíbrio econômico-financeiro</text>

  <rect x="36" y="246" width="200" height="248" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="246" width="200" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="274" width="200" height="12" fill="#0B1F38"/>
  <text x="56" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Reajuste</text>
  <text x="52" y="318" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atualiza valores pela</text>
  <text x="52" y="338" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">variação de custos.</text>
  <text x="52" y="374" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Corrige por índice.</text>
  <text x="52" y="398" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Não muda a estrutura.</text>
  <text x="52" y="434" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Periodicidade definida</text>
  <text x="52" y="454" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">no ato tarifário.</text>
  <text x="52" y="478" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Atualização, não reforma.</text>

  <rect x="252" y="246" width="200" height="248" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="252" y="246" width="200" height="40" rx="8" fill="#0B1F38"/>
  <rect x="252" y="274" width="200" height="12" fill="#0B1F38"/>
  <text x="272" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Revisão</text>
  <text x="268" y="318" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Reexame amplo da</text>
  <text x="268" y="338" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">estrutura tarifária.</text>
  <text x="268" y="374" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Pode alterar faixas,</text>
  <text x="268" y="394" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">categorias e critérios.</text>
  <text x="268" y="430" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Mais profunda que o</text>
  <text x="268" y="450" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">simples reajuste.</text>
  <text x="268" y="474" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Pegadinha clássica de prova.</text>

  <rect x="468" y="246" width="216" height="248" rx="8" fill="#0B1F38"/>
  <text x="488" y="274" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Modicidade</text>
  <text x="484" y="310" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Acessibilidade econômica</text>
  <text x="484" y="330" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">das tarifas ao usuário.</text>
  <text x="484" y="366" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Conciliar com o</text>
  <text x="484" y="386" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">equilíbrio econômico-</text>
  <text x="484" y="406" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">financeiro da prestação.</text>
  <text x="484" y="442" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Não é tarifa zerada.</text>
  <text x="484" y="474" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Dois polos, um só critério.</text>

  <rect x="36" y="512" width="648" height="176" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="544" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">O que o decreto define</text>
  <line x1="56" y1="554" x2="176" y2="554" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="588" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Composição das tarifas, reajuste/revisão e categorias de usuários.</text>
  <text x="56" y="616" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Deve observar a legislação aplicável e os critérios de regulação.</text>
  <text x="56" y="644" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Decreto regulamenta; não pode contrariar a lei nem o ato regulatório.</text>
  <text x="56" y="672" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Reajuste corrige valores; revisão reexamina a estrutura.</text>

  <rect x="36" y="706" width="648" height="190" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="706" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="734" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="734" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Hierarquia e prova</text>
  <text x="56" y="778" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Lei e regulação acima do decreto municipal de tarifas.</text>
  <text x="56" y="806" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Modicidade e equilíbrio econômico-financeiro devem ser conciliados.</text>
  <text x="56" y="834" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Categorias de usuários integram a composição tarifária.</text>
  <text x="56" y="870" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Referência: Decreto nº 19.545/2021 (tarifas do DMAE).</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Reajuste corrige valores por índice; revisão reexamina a estrutura.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Modicidade e equilíbrio econômico-financeiro devem ser conciliados.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Decreto regulamenta; não pode contrariar a lei nem o ato regulatório.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Reajuste: atualização. Revisão: reexame amplo. Modicidade: acesso.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h19545-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
