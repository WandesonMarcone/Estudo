<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Decreto nº 19.545/2021 — tarifas</title>
  <desc id="d">Tarifas de água e esgoto: composição, categorias, reajuste e revisão. Modicidade e equilíbrio econômico-financeiro.</desc>
  <defs>
    <linearGradient id="h19545-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

