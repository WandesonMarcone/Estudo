<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Conjuntos: união, interseção e diferença</title>
  <desc id="d">Diagramas de Venn com A = {1,2,3,4}, B = {3,4,5,6}. União, interseção e diferença, com a fórmula da cardinalidade.</desc>
  <defs>
    <linearGradient id="h5-navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#122A4C"/>
      <stop offset="1" stop-color="#081526"/>
    </linearGradient>
  </defs>

  <rect width="720" height="1320" fill="#F4F0E6"/>
  <rect x="24" y="148" width="672" height="1072" fill="none" stroke="#D4CDB8" stroke-width="1"/>
  <path d="M24 160 h14 M24 148 v14 M696 160 h-14 M696 148 v14 M24 1206 h14 M24 1220 v-14 M696 1206 h-14 M696 1220 v-14" fill="none" stroke="#C4A35A" stroke-width="1.4"/>

  <rect width="720" height="132" fill="url(#h5-navy)"/>
  <line x1="36" y1="22" x2="128" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <line x1="592" y1="22" x2="684" y2="22" stroke="#C4A35A" stroke-width="1.3"/>
  <circle cx="36" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="128" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="592" cy="22" r="2.2" fill="#C4A35A"/>
  <circle cx="684" cy="22" r="2.2" fill="#C4A35A"/>
  <g transform="translate(360 28)" aria-hidden="true">
    <g transform="scale(0.0544) translate(-234 -275.3)">
      <polygon points="225,0 471,144 471,402 237,550 0,410 0,146" fill="#C4A35A"/>
      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Conjuntos</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">União, interseção e diferença</text>

  <rect x="36" y="156" width="648" height="70" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Exemplo:  A = {1, 2, 3, 4}    B = {3, 4, 5, 6}</text>
  <text x="360" y="208" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Universo U = retângulo. Números só para visualizar.</text>

  <rect x="36" y="244" width="648" height="268" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="274" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">A ∪ B  união  — tudo de A ou de B</text>
  <line x1="56" y1="284" x2="176" y2="284" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="86" y="298" width="548" height="168" rx="6" fill="#F7F3E8" stroke="#8A8374" stroke-width="1.4"/>
  <text x="104" y="320" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">U</text>
  <circle cx="300" cy="390" r="78" fill="#C4A35A" fill-opacity="0.28" stroke="#0B1F38" stroke-width="2.2"/>
  <circle cx="420" cy="390" r="78" fill="#0B1F38" fill-opacity="0.18" stroke="#0B1F38" stroke-width="2.2"/>
  <text x="248" y="360" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">A</text>
  <text x="456" y="360" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">B</text>
  <text x="248" y="400" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700">1  2</text>
  <text x="348" y="400" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700">3  4</text>
  <text x="456" y="400" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700">5  6</text>
  <text x="360" y="492" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">A ∪ B = {1, 2, 3, 4, 5, 6}</text>
  <g fill="none" stroke="#C4A35A" stroke-width="1.35">
    <circle cx="360" cy="400" r="4"/>
    <path d="M360 400 V444"/>
    <circle cx="360" cy="444" r="3"/>
  </g>

  <rect x="36" y="528" width="316" height="292" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="528" width="316" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="556" width="316" height="12" fill="#0B1F38"/>
  <g transform="translate(54 542)" fill="none" stroke="#C4A35A" stroke-width="1.4">
    <circle cx="6" cy="6" r="6"/>
    <circle cx="12" cy="6" r="6"/>
  </g>
  <text x="80" y="556" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">A ∩ B  interseção</text>
  <text x="194" y="592" text-anchor="middle" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">só o que está nos dois</text>
  <circle cx="154" cy="678" r="66" fill="none" stroke="#0B1F38" stroke-width="2"/>
  <circle cx="234" cy="678" r="66" fill="none" stroke="#0B1F38" stroke-width="2"/>
  <ellipse cx="194" cy="678" rx="30" ry="50" fill="#C4A35A"/>
  <text x="194" y="686" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">3  4</text>
  <text x="194" y="790" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">A ∩ B = {3, 4}</text>

  <rect x="368" y="528" width="316" height="292" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="368" y="528" width="316" height="40" rx="8" fill="#0B1F38"/>
  <rect x="368" y="556" width="316" height="12" fill="#0B1F38"/>
  <g transform="translate(386 542)" fill="none" stroke="#C4A35A" stroke-width="1.4">
    <circle cx="6" cy="6" r="6"/>
    <circle cx="14" cy="6" r="6"/>
    <path d="M10 0 v12"/>
  </g>
  <text x="414" y="556" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">A − B  diferença</text>
  <text x="526" y="592" text-anchor="middle" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">em A e não em B</text>
  <circle cx="492" cy="678" r="66" fill="#C4A35A" fill-opacity="0.35" stroke="#0B1F38" stroke-width="2"/>
  <circle cx="572" cy="678" r="66" fill="#F4F0E6" stroke="#8A8374" stroke-width="2"/>
  <text x="468" y="686" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">1  2</text>
  <text x="526" y="790" text-anchor="middle" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">A − B = {1, 2}</text>

  <rect x="36" y="836" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="866" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="18" font-weight="700">n(A ∪ B) = n(A) + n(B) − n(A ∩ B)</text>
  <text x="360" y="890" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Exemplo: 4 + 4 − 2 = 6</text>

  <rect x="36" y="928" width="648" height="280" rx="8" fill="#0B1F38"/>
  <rect x="36" y="928" width="8" height="280" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 952)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="968" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="1008" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Não some n(A)+n(B) sem descontar a interseção.</text>
  <text x="64" y="1040" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">∈ relaciona elemento e conjunto; ⊂ relaciona conjuntos.</text>
  <line x1="64" y1="1062" x2="652" y2="1062" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1094" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Complementar depende do universo U adotado.</text>
  <text x="64" y="1180" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#h5-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
