  <rect x="36" y="544" width="316" height="148" rx="6" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="544" width="316" height="36" rx="6" fill="#0B1F38"/>
  <rect x="36" y="568" width="316" height="12" fill="#0B1F38"/>
  <text x="56" y="568" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">O que é</text>
  <text x="56" y="608" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Obra de referência técnica.</text>
  <text x="56" y="632" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Apoio a projetos, operação</text>
  <text x="56" y="656" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">e ações de saúde.</text>
  <text x="56" y="676" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Abrange os quatro componentes.</text>

  <rect x="368" y="544" width="316" height="148" rx="6" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="368" y="544" width="316" height="36" rx="6" fill="#0B1F38"/>
  <rect x="368" y="568" width="316" height="12" fill="#0B1F38"/>
  <text x="388" y="568" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">O que não é</text>
  <text x="388" y="608" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Não é norma jurídica.</text>
  <text x="388" y="632" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Não tem força de lei.</text>
  <text x="388" y="656" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Não é impositiva.</text>
  <text x="388" y="676" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Manual técnico = orientação.</text>

  <rect x="36" y="710" width="648" height="186" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="740" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">FUNASA no saneamento</text>
  <line x1="56" y1="750" x2="176" y2="750" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="782" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Fundação pública vinculada ao Ministério da Saúde.</text>
  <text x="56" y="810" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Atuação histórica em saneamento e saúde pública.</text>
  <text x="56" y="838" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Abastecimento de água: componente ligado ao fornecimento.</text>
  <text x="56" y="870" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">FUNASA se vincula à saúde, com atuação em saneamento.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
