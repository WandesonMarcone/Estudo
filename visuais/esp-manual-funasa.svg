<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" width="100%" height="100%" role="img" aria-labelledby="t d">
  <title id="t">Manual de Saneamento da FUNASA</title>
  <desc id="d">Obra de referência técnica sobre água, esgoto, resíduos e drenagem. FUNASA atua em saneamento e saúde pública. O manual não é norma jurídica impositiva.</desc>
