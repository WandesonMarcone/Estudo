  <text x="360" y="404" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">técnico</text>
  <rect x="56" y="308" width="168" height="72" rx="6" fill="#0B1F38"/>
  <text x="140" y="340" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ÁGUA</text>
  <text x="140" y="360" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">abastecimento</text>
  <rect x="496" y="308" width="168" height="72" rx="6" fill="#0B1F38"/>
  <text x="580" y="340" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ESGOTO</text>
  <text x="580" y="360" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">esgotamento</text>
  <rect x="56" y="424" width="168" height="72" rx="6" fill="#0B1F38"/>
  <text x="140" y="456" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">RESÍDUOS</text>
  <text x="140" y="476" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">sólidos</text>
  <rect x="496" y="424" width="168" height="72" rx="6" fill="#0B1F38"/>
  <text x="580" y="456" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">DRENAGEM</text>
  <text x="580" y="476" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">águas pluviais</text>
