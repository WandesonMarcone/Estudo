      <polygon points="226.3,38.5 437.8,162.4 437.8,384.3 236.6,511.5 32.8,391.1 32.8,164.1" fill="#0B1F38"/>
      <polygon points="227.2,66.1 414.1,175.5 414.1,371.6 236.3,484.1 56.2,377.7 56.2,177" fill="#173B5F"/>
      <polygon points="228.1,93.6 390.4,188.7 390.4,358.9 236,456.6 79.6,364.2 79.6,190" fill="#0B1F38"/>
      <path fill="#E2C77A" fill-rule="evenodd" stroke="#061522" stroke-width="20" stroke-linejoin="round" paint-order="stroke fill" d="M173 103L151 120L0 405L45 427L96 327L246 327L303 436L342 410L295 319L372 319L401 271L268 269L185 107ZM174 189L221 282L121 283ZM238 74L238 183L275 253L294 253L295 162L415 235L412 174Z"/>
      <polygon points="52,432 55,439 171,505 171,493 165,482 61,422" fill="#173B5F"/>
    </g>
  </g>
  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Diagramas</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Venn, tabelas e dupla entrada</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Organizar dados: o problema vira conta simples</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Interseção primeiro; conferir o total no fim</text>

  <rect x="36" y="246" width="200" height="248" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="246" width="200" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="274" width="200" height="12" fill="#0B1F38"/>
  <text x="56" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Venn</text>
  <circle cx="100" cy="370" r="52" fill="#C4A35A" fill-opacity="0.28" stroke="#0B1F38" stroke-width="1.5"/>
  <circle cx="148" cy="370" r="52" fill="#0B1F38" fill-opacity="0.18" stroke="#0B1F38" stroke-width="1.5"/>
  <text x="52" y="450" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">A ∩ B no meio.</text>
  <text x="52" y="470" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Só A, só B, nenhum.</text>

  <rect x="252" y="246" width="200" height="248" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <rect x="252" y="246" width="200" height="40" rx="8" fill="#0B1F38"/>
  <rect x="252" y="274" width="200" height="12" fill="#0B1F38"/>
  <text x="272" y="274" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Preenchimento</text>
  <text x="268" y="318" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">1. Interseção.</text>
  <text x="268" y="342" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">2. Só A e só B.</text>
  <text x="268" y="366" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">3. Fora dos conjuntos.</text>
  <text x="268" y="402" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Não somar duas vezes</text>
  <text x="268" y="422" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">a interseção.</text>
  <text x="268" y="458" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">n(A∪B)=n(A)+n(B)−n(A∩B)</text>
  <text x="268" y="478" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Conferir o total.</text>

  <rect x="468" y="246" width="216" height="248" rx="8" fill="#0B1F38"/>
  <text x="488" y="274" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Dupla entrada</text>
  <text x="484" y="310" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Tabela que cruza</text>
  <text x="484" y="330" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">duas categorias.</text>
  <text x="484" y="366" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Linhas × colunas:</text>
  <text x="484" y="386" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">cada célula um cruzamento.</text>
  <text x="484" y="422" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Somar margens = total.</text>
  <text x="484" y="454" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Lógica vira organização.</text>
  <text x="484" y="474" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Relações entre categorias.</text>

  <rect x="36" y="512" width="648" height="176" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="544" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Método</text>
  <line x1="56" y1="554" x2="176" y2="554" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="56" y="588" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Representar conjuntos e interseções em regiões sem sobrepor.</text>
  <text x="56" y="616" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Preencher primeiro a interseção costuma facilitar.</text>
  <text x="56" y="644" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Usar tabelas para cruzar informações de duas categorias.</text>
  <text x="56" y="672" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Conferir se o total corresponde ao enunciado.</text>

  <rect x="36" y="706" width="648" height="190" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="706" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="734" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="734" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Armadilhas</text>
  <text x="56" y="778" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Somar as regiões sem sobreposição indevida é essencial.</text>
  <text x="56" y="806" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">"Pelo menos um" inclui a interseção; "somente" exclui.</text>
  <text x="56" y="834" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Três conjuntos: sete regiões internas + o exterior.</text>
  <text x="56" y="870" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Interseção: região comum a dois conjuntos.</text>

  <rect x="36" y="916" width="648" height="292" rx="8" fill="#0B1F38"/>
  <rect x="36" y="916" width="8" height="292" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 940)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="956" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="996" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Somar as regiões sem sobreposição indevida.</text>
  <text x="64" y="1028" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Preencher primeiro a interseção costuma facilitar.</text>
  <text x="64" y="1060" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Conferir se o total corresponde ao enunciado.</text>
  <line x1="64" y1="1080" x2="652" y2="1080" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1112" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Venn: círculos. Dupla entrada: cruza categorias. Interseção no meio.</text>
  <text x="64" y="1182" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

  <rect x="0" y="1260" width="720" height="60" fill="url(#m24-navy)"/>
  <line x1="220" y1="1290" x2="260" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <line x1="460" y1="1290" x2="500" y2="1290" stroke="#C4A35A" stroke-width="1"/>
  <text x="360" y="1295" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="2.2">ALVO FARDADO | RESUMO VISUAL</text>
</svg>
