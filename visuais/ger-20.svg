  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Atualidades</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Contexto, fontes e revisão</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Fatos recentes relevantes para a prova</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Cobrança de contexto e relações entre fatos, não de decoreba</text>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif">
    <rect x="36" y="246" width="208" height="100" rx="6" fill="#0B1F38"/>
    <text x="140" y="286" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">POLÍTICA</text>
    <text x="140" y="312" text-anchor="middle" fill="#F8F4EA" font-size="13">e economia</text>
    <rect x="256" y="246" width="208" height="100" rx="6" fill="#0B1F38"/>
    <text x="360" y="286" text-anchor="middle" fill="#C4A35A" font-size="12" font-weight="700">SOCIEDADE</text>
    <text x="360" y="312" text-anchor="middle" fill="#F8F4EA" font-size="13">e meio ambiente</text>
    <rect x="476" y="246" width="208" height="100" rx="6" fill="#C4A35A"/>
    <text x="580" y="286" text-anchor="middle" fill="#0B1F38" font-size="12" font-weight="700">CONTEXTO</text>
    <text x="580" y="312" text-anchor="middle" fill="#0B1F38" font-size="13">causas e efeitos</text>
  </g>
  <rect x="36" y="364" width="648" height="100" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="400" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Revisar periodicamente com fontes confiáveis</text>
  <text x="56" y="432" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Veículo ou órgão com credibilidade e verificação de fatos.</text>
  <rect x="36" y="482" width="648" height="148" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="514" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">O que a banca costuma cobrar</text>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">
    <rect x="56" y="532" width="148" height="72" rx="6" fill="#0B1F38"/>
    <text x="130" y="564" text-anchor="middle" fill="#C4A35A" font-weight="700">CAUSAS</text>
    <text x="130" y="586" text-anchor="middle" fill="#F8F4EA">do fato</text>
    <rect x="212" y="532" width="148" height="72" rx="6" fill="#0B1F38"/>
    <text x="286" y="564" text-anchor="middle" fill="#C4A35A" font-weight="700">EFEITOS</text>
    <text x="286" y="586" text-anchor="middle" fill="#F8F4EA">consequências</text>
    <rect x="368" y="532" width="148" height="72" rx="6" fill="#0B1F38"/>
    <text x="442" y="564" text-anchor="middle" fill="#C4A35A" font-weight="700">RELAÇÕES</text>
    <text x="442" y="586" text-anchor="middle" fill="#F8F4EA">entre temas</text>
    <rect x="524" y="532" width="140" height="72" rx="6" fill="#C4A35A"/>
    <text x="594" y="564" text-anchor="middle" fill="#0B1F38" font-weight="700">NÃO DATAS</text>
    <text x="594" y="586" text-anchor="middle" fill="#0B1F38">isoladas</text>
  </g>
  <rect x="36" y="648" width="316" height="82" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="682" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Fonte confiável</text>
  <text x="56" y="708" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Órgão oficial ou veículo com checagem.</text>

  <rect x="368" y="648" width="316" height="82" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="682" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Contexto</text>
  <text x="388" y="708" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Causas e consequências de um fato.</text>
  <rect x="36" y="748" width="648" height="134" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="748" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="776" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="776" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Como estudar</text>
  <text x="56" y="820" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Priorizar compreensão do cenário em vez de memorizar manchetes.</text>
  <text x="56" y="852" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Conteúdo preparado para atualização posterior.</text>
  <rect x="36" y="900" width="648" height="308" rx="8" fill="#0B1F38"/>
  <rect x="36" y="900" width="8" height="308" rx="4" fill="#C4A35A"/>
  <g transform="translate(64 924)" fill="none" stroke="#C4A35A" stroke-width="1.6">
    <path d="M8 1 L15 14 H1 Z"/>
    <line x1="8" y1="6" x2="8" y2="9.5"/>
    <circle cx="8" cy="12.2" r="0.8" fill="#C4A35A" stroke="none"/>
  </g>
  <text x="90" y="940" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.4">PONTO DE PROVA</text>
  <text x="64" y="980" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Este conteúdo exige atualização antes da prova.</text>
  <text x="64" y="1012" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Priorizar compreensão de contexto, não memorizar manchetes.</text>
  <text x="64" y="1044" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16">Usar fontes oficiais e veículos confiáveis na revisão.</text>
  <line x1="64" y1="1076" x2="652" y2="1076" stroke="#C4A35A" stroke-width="0.8" opacity="0.45"/>
  <text x="64" y="1108" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Atualidades = fatos recentes relevantes, não lista de datas.</text>
  <text x="64" y="1180" fill="#8A8374" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Atenção na prova</text>

