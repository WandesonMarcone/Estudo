  <text x="360" y="62" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="3.2">ALVO FARDADO</text>
  <text x="360" y="96" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Trigonometria</text>
  <text x="360" y="118" text-anchor="middle" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Seno, cosseno e tangente</text>

  <rect x="36" y="156" width="648" height="72" rx="6" fill="#0B1F38"/>
  <text x="360" y="186" text-anchor="middle" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Seno, cosseno e tangente no triângulo retângulo</text>
  <text x="360" y="210" text-anchor="middle" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">sen²x + cos²x = 1</text>

  <rect x="36" y="246" width="316" height="268" rx="8" fill="#EDE8DB" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="56" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Triângulo retângulo</text>
  <line x1="56" y1="286" x2="176" y2="286" stroke="#C4A35A" stroke-width="1.4"/>
  <polygon points="80,470 80,330 270,470" fill="#C4A35A" fill-opacity="0.25" stroke="#0B1F38" stroke-width="2"/>
  <rect x="80" y="454" width="16" height="16" fill="none" stroke="#0B1F38" stroke-width="1.6"/>
  <text x="88" y="322" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">ângulo</text>
  <text x="178" y="390" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12" font-weight="700">hipotenusa</text>
  <text x="40" y="410" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">oposto</text>
  <text x="150" y="492" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">adjacente</text>
  <text x="56" y="508" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="11">Hipotenusa: lado oposto ao ângulo reto.</text>

  <rect x="368" y="246" width="316" height="268" rx="8" fill="#F7F3E8" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="276" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">Razões</text>
  <line x1="388" y1="286" x2="508" y2="286" stroke="#C4A35A" stroke-width="1.4"/>
  <text x="388" y="322" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">sen = cateto oposto / hipotenusa</text>
  <text x="388" y="350" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">cos = cateto adjacente / hipotenusa</text>
  <text x="388" y="378" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">tg = cateto oposto / cateto adjacente</text>
  <text x="388" y="418" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">Cateto: lado do ângulo reto.</text>
  <text x="388" y="450" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">As razões dependem do ângulo,</text>
  <text x="388" y="470" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">não do tamanho do triângulo.</text>
  <text x="388" y="494" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Verificar oposto ou adjacente.</text>

  <rect x="36" y="532" width="316" height="160" rx="8" fill="#0B1F38"/>
  <text x="56" y="564" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Ângulos notáveis</text>
  <text x="56" y="592" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">30°, 45° e 60°</text>
  <text x="56" y="620" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Valores a memorizar.</text>
  <text x="56" y="656" fill="#C4A35A" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13" font-weight="700">Tangente pode ser indefinida para 90°.</text>
  <text x="56" y="676" fill="#C9C2B0" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="12">Ângulo de valores conhecidos.</text>

  <rect x="368" y="532" width="316" height="160" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <text x="388" y="564" fill="#0B1F38" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Relação fundamental</text>
  <text x="388" y="600" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="16" font-weight="700">sen²x + cos²x = 1</text>
  <text x="388" y="636" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14">Teorema de Pitágoras e aplicações.</text>
  <text x="388" y="664" fill="#6B665B" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="13">Alturas, distâncias e inclinações.</text>

  <rect x="36" y="710" width="648" height="186" rx="8" fill="#F7F3E8" stroke="#D4CDB8" stroke-width="1.2"/>
  <rect x="36" y="710" width="648" height="40" rx="8" fill="#0B1F38"/>
  <rect x="36" y="738" width="648" height="12" fill="#0B1F38"/>
  <text x="56" y="738" fill="#F8F4EA" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Uso em prova</text>
  <text x="56" y="782" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Seno, cosseno e tangente no triângulo retângulo.</text>
  <text x="56" y="810" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Valores dos ângulos notáveis.</text>
  <text x="56" y="838" fill="#3A372F" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="15">Verificar se o lado é oposto ou adjacente ao ângulo considerado.</text>
  <text x="56" y="870" fill="#9A7420" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="14" font-weight="700">As razões dependem do ângulo, não do tamanho do triângulo.</text>

