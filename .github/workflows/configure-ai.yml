name: Configurar tutor IA no Supabase

on:
  workflow_dispatch:

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Enviar chaves ao Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          supabase link --project-ref mvrhaowftvhakvfhawms
          supabase secrets set --project-ref mvrhaowftvhakvfhawms \
            GROQ_API_KEY="$GROQ_API_KEY" \
            OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            AI_PROVIDER=groq \
            GROQ_MODEL=openai/gpt-oss-120b \
            OPENROUTER_MODEL=openai/gpt-oss-120b \
            OPENAI_MODEL=gpt-4o-mini
      - name: Publicar função protegida
        run: supabase functions deploy study-tutor --project-ref mvrhaowftvhakvfhawms --no-verify-jwt
